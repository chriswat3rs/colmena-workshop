<script>
/* ============================================================
   Utilidades
   ============================================================ */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,10));
const now = () => new Date().toISOString();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function storageGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (window.__mem=window.__mem||{})[k]??null; } }
function storageSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ (window.__mem=window.__mem||{})[k]=v; } }
function makeCode(){ const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function csvCell(v){ v=String(v??""); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(name, rows){
  const csv = "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

/* ---------- v1.2: cálculos compartidos (participante y facilitador) ---------- */
/* Retos de la fase Ideas: los N dolores más votados (desempate: el más antiguo) */
function topPains(cards, totals, n){
  return [...cards].map(c=>({...c, pts: totals[c.id]||0})).filter(c=>c.pts>0)
    .sort((a,b)=> b.pts-a.pts || String(a.created_at).localeCompare(String(b.created_at)) || String(a.id).localeCompare(String(b.id)))
    .slice(0, n||3);
}
/* Índice 0–100 de un elemento calificado (puntaje 3 = 100, 2 = 50, 1 = 0; el 0 no cuenta).
   Para «tiempos» el 0 sí es un dato (menos de 1 día) y el índice es la duración típica: 0 = menos de 1 día … 100 = más de 2 semanas. */
function qwStats(t, kind){
  const m=t&&t.m||0, a=t&&t.a||0, p=t&&t.p||0, na=t&&t.na||0;
  if(kind==="time"){ const n=m+a+p+na; const counts=[na,p,a,m]; const mode=n? counts.indexOf(Math.max(...counts)) : null;
    return {m,a,p,na,n, idx: n? Math.round((m*100+a*66.7+p*33.3)/n) : null, mode}; }
  const base=m+a+p;
  return {m,a,p,na,n:base+na, idx: base ? Math.round((m*100+a*50)/base) : null};
}
/* Cuenta calificaciones crudas → {qw_id:{m,a,p,na}} */
function qwCount(ratings){
  const t={}; ratings.forEach(r=>{ const o=t[r.qw_id]=t[r.qw_id]||{m:0,a:0,p:0,na:0};
    if(r.score===3) o.m++; else if(r.score===2) o.a++; else if(r.score===1) o.p++; else o.na++; });
  return t;
}
/* Etiqueta corta de etapa: «3 Revisar información» → «3» */
function shortStage(t){ const m=String(t||"").match(/^(\d+)\b/); return m ? m[1] : String(t||""); }
function toolsFor(session, stage){
  const own = (session && session.tools && session.tools[stage]) || [];
  return [...new Set([...own, ...COMMON_TOOLS])];
}
/* «3.7 Validación de bajas» → número LOCFY24 chico y gris + texto (el número es para cruzar con el tracking, no para el equipo) */
function taskHTML(t){ const m=String(t||"").match(/^(\d+(?:\.\d+)*)\s+(.+)$/); return m ? `<small class="tnum">${esc(m[1])}</small>${esc(m[2])}` : esc(t); }
/* Actividades configuradas para una etapa (v1.3); vacío si el taller no las define */
function tasksFor(session, stage){ return (session && session.tasks && session.tasks[stage]) || []; }
function linesOf(v){ return String(v||"").split("\n").map(x=>x.trim()).filter(Boolean); }

</script>
<script>
/* ============================================================
   Store — misma interfaz para Supabase (con autenticación) y modo demo.
   Toda la seguridad real vive en la base de datos (setup.sql):
   la página solo pide; Supabase decide qué entrega a quién.
   ============================================================ */
const HAS_SUPA = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);

function friendlyAuthError(e){
  const m = String(e && (e.message || e.msg || e.error_description) || e || "");
  if(/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if(/Anonymous sign-ins are disabled/i.test(m)) return "El acceso de participantes no está activado. Quien facilita debe activar «Allow anonymous sign-ins» en Supabase.";
  if(/rate limit|too many/i.test(m)) return "Demasiados intentos seguidos. Espera un minuto y vuelve a intentar.";
  if(/Invalid TOTP code|invalid.*code/i.test(m)) return "El código no es correcto o ya expiró. Usa el código actual de tu app.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No hay conexión con la base de datos. Revisa tu internet (en Wi-Fi corporativo prueba con datos móviles).";
  return m || "Algo salió mal. Intenta de nuevo.";
}

const SupaStore = {
  client:null,
  init(){
    this.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:"colmena-auth" }
    });
  },
  async currentUser(){ const {data} = await this.client.auth.getSession(); return data.session ? data.session.user : null; },

  /* ---- Participante: identidad anónima automática ---- */
  async ensureAnon(){
    const u = await this.currentUser();
    if(u) return u;
    const {data,error} = await this.client.auth.signInAnonymously();
    if(error) throw error;
    return data.user;
  },

  /* ---- Facilitador: correo + contraseña + segundo factor ---- */
  async adminState(){
    const u = await this.currentUser();
    if(!u || u.is_anonymous) return {state:"login"};
    const {data:aal,error} = await this.client.auth.mfa.getAuthenticatorAssuranceLevel();
    if(error) throw error;
    if(aal.currentLevel === "aal2"){
      const {data:isAdmin,error:e2} = await this.client.rpc("ws_claim_admin");
      if(e2) throw e2;
      return {state: isAdmin ? "ready" : "forbidden", email:u.email};
    }
    return {state: aal.nextLevel === "aal2" ? "verify" : "enroll", email:u.email};
  },
  async signIn(email,password){
    const {error} = await this.client.auth.signInWithPassword({email,password});
    if(error) throw error;
  },
  async signOut(){ await this.client.auth.signOut(); },
  async mfaEnroll(){
    const {data:list} = await this.client.auth.mfa.listFactors();
    for(const f of (list && list.all || [])){
      if(f.factor_type === "totp" && f.status !== "verified") await this.client.auth.mfa.unenroll({factorId:f.id});
    }
    const {data,error} = await this.client.auth.mfa.enroll({factorType:"totp", friendlyName:"Colmena "+new Date().toISOString().slice(0,16)});
    if(error) throw error;
    return {factorId:data.id, uri:data.totp.uri, secret:data.totp.secret};
  },
  async mfaVerify(factorId, code){
    if(!factorId){
      const {data:list} = await this.client.auth.mfa.listFactors();
      const f = (list && list.totp || []).find(x=>x.status==="verified");
      if(!f) throw new Error("No hay un segundo factor activo en esta cuenta.");
      factorId = f.id;
    }
    const {error} = await this.client.auth.mfa.challengeAndVerify({factorId, code});
    if(error) throw error;
  },

  /* ---- Sesiones ---- */
  async createSession(s){ const {data,error}=await this.client.from("ws_sessions").insert(s).select().single(); if(error) throw error; return data; },
  async getMySession(code){ const {data,error}=await this.client.from("ws_sessions").select("*").eq("code",code.toUpperCase()).maybeSingle(); if(error) throw error; return data; },
  async lookupSession(code){ const {data,error}=await this.client.rpc("ws_join_lookup",{p_code:code}); if(error) throw error; return (data && data[0]) || null; },
  async listMySessions(){ const u=await this.currentUser(); const {data,error}=await this.client.from("ws_sessions").select("id,code,name,phase,created_at").eq("owner_id",u.id).order("created_at",{ascending:false}); if(error) throw error; return data||[]; },
  async updateSession(id,patch){ const {error}=await this.client.from("ws_sessions").update(patch).eq("id",id); if(error) throw error; },
  async deleteSession(id){ const {error}=await this.client.from("ws_sessions").delete().eq("id",id); if(error) throw error; },

  /* ---- Participantes ---- */
  async joinParticipant(p){
    const {data,error}=await this.client.from("ws_participants").insert(p).select().single();
    if(error){ if(error.code==="23505") return this.myParticipant(p.session_id); throw error; }
    return data;
  },
  async myParticipant(sid){ const u=await this.currentUser(); if(!u) return null; const {data,error}=await this.client.from("ws_participants").select("*").eq("session_id",sid).eq("user_id",u.id).maybeSingle(); if(error) throw error; return data; },
  async updateParticipant(id,patch){ const {error}=await this.client.from("ws_participants").update(patch).eq("id",id); if(error) throw error; },
  async listParticipants(sid){ const {data,error}=await this.client.from("ws_participants").select("*").eq("session_id",sid).order("joined_at"); if(error) throw error; return data||[]; },

  /* ---- Tarjetas y votos ---- */
  async addCard(c){ const {data,error}=await this.client.from("ws_cards").insert(c).select().single(); if(error) throw error; return data; },
  async deleteCard(id){ const {error}=await this.client.from("ws_cards").delete().eq("id",id); if(error) throw error; },
  async listCards(sid){ const {data,error}=await this.client.from("ws_cards").select("*").eq("session_id",sid).order("created_at"); if(error) throw error; return data||[]; },
  async setVote(v){
    if(v.points<=0){ const {error}=await this.client.from("ws_votes").delete().eq("session_id",v.session_id).eq("participant_id",v.participant_id).eq("card_id",v.card_id); if(error) throw error; return; }
    const {error}=await this.client.from("ws_votes").upsert(v,{onConflict:"session_id,participant_id,card_id"}); if(error) throw error;
  },
  async listMyVotes(sid,pid){ const {data,error}=await this.client.from("ws_votes").select("*").eq("session_id",sid).eq("participant_id",pid); if(error) throw error; return data||[]; },
  async listVotes(sid){ const {data,error}=await this.client.from("ws_votes").select("*").eq("session_id",sid); if(error) throw error; return data||[]; },
  async cardTotals(sid){ const {data,error}=await this.client.rpc("ws_card_totals",{p_session:sid}); if(error) throw error; const t={}; (data||[]).forEach(r=>t[r.card_id]=Number(r.points)||0); return t; },

  /* ---- v1.2 · Quick wins ---- */
  async setQwRating(r){ const {error}=await this.client.from("ws_qw_ratings").upsert(r,{onConflict:"session_id,participant_id,qw_id"}); if(error) throw error; },
  async phaseProgress(sid){ const {data,error}=await this.client.rpc("ws_phase_progress",{p_session:sid}); if(error) throw error; return (data&&data[0])||null; },
  async listMyQwRatings(sid,pid){ const {data,error}=await this.client.from("ws_qw_ratings").select("qw_id,score").eq("session_id",sid).eq("participant_id",pid); if(error) throw error; return data||[]; },
  async listQwRatings(sid){ const {data,error}=await this.client.from("ws_qw_ratings").select("*").eq("session_id",sid); if(error) throw error; return data||[]; },
  async qwTotals(sid){ const {data,error}=await this.client.rpc("ws_qw_totals",{p_session:sid}); if(error) throw error; const t={}; (data||[]).forEach(r=>t[r.qw_id]={m:+r.mucho||0,a:+r.algo||0,p:+r.poco||0,na:+r.no_aplica||0}); return t; },

  /* ---- v1.2 · Ideas y propuestas de quick win ---- */
  async addIdea(i){ const {data,error}=await this.client.from("ws_ideas").insert(i).select().single(); if(error) throw error; return data; },
  async deleteIdea(id){ const {error}=await this.client.from("ws_ideas").delete().eq("id",id); if(error) throw error; },
  async listIdeas(sid){ const {data,error}=await this.client.from("ws_ideas").select("*").eq("session_id",sid).order("created_at"); if(error) throw error; return data||[]; },
  async listMyIdeaVotes(sid,pid){ const {data,error}=await this.client.from("ws_idea_votes").select("idea_id").eq("session_id",sid).eq("participant_id",pid); if(error) throw error; return data||[]; },
  async listIdeaVotes(sid){ const {data,error}=await this.client.from("ws_idea_votes").select("*").eq("session_id",sid); if(error) throw error; return data||[]; },
  async setIdeaVote(v,on){
    if(on){ const {error}=await this.client.from("ws_idea_votes").insert(v); if(error) throw error; return; }
    const {error}=await this.client.from("ws_idea_votes").delete().eq("session_id",v.session_id).eq("participant_id",v.participant_id).eq("idea_id",v.idea_id); if(error) throw error;
  },
  async ideaTotals(sid){ const {data,error}=await this.client.rpc("ws_idea_totals",{p_session:sid}); if(error) throw error; const t={}; (data||[]).forEach(r=>t[r.idea_id]=Number(r.votes)||0); return t; },

  subscribe(sid, cb){
    const ch = this.client.channel("ws-"+sid);
    ["ws_sessions","ws_participants","ws_cards","ws_votes","ws_qw_ratings","ws_ideas","ws_idea_votes"].forEach(tb=>{
      ch.on("postgres_changes",{event:"*",schema:"public",table:tb,filter: tb==="ws_sessions" ? "id=eq."+sid : "session_id=eq."+sid}, ()=>cb(tb));
    });
    ch.subscribe();
    return ()=>{ try{ this.client.removeChannel(ch); }catch(e){} };
  }
};

/* Modo demo: guarda en este navegador. Sin cuentas ni segundo factor.
   Cada pestaña es un participante distinto, para poder probar varios. */
const DemoStore = {
  KEY:"colmena_demo_db",
  db(){ let d=null; try{ d=JSON.parse(storageGet(this.KEY)); }catch(e){}
    d=d||{}; ["sessions","participants","cards","votes","qw","ideas","ideaVotes"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; }); return d; },
  save(db){ storageSet(this.KEY, JSON.stringify(db)); window.dispatchEvent(new Event("demo-change")); },
  _cbs:[],
  init(){ window.addEventListener("storage", e=>{ if(e.key===this.KEY) this._cbs.forEach(cb=>cb("storage")); }); window.addEventListener("demo-change", ()=>this._cbs.forEach(cb=>cb("local"))); },
  _uid(){ let id=null; try{ id=sessionStorage.getItem("colmena_demo_uid"); if(!id){ id=uid(); sessionStorage.setItem("colmena_demo_uid",id); } }catch(e){ id=window.__demoUid=window.__demoUid||uid(); } return id; },
  async currentUser(){ return {id:this._uid(), is_anonymous:true}; },
  async ensureAnon(){ return this.currentUser(); },
  async adminState(){ return {state:"ready", email:"modo demo"}; },
  async signIn(){}, async signOut(){}, async mfaEnroll(){ return {}; }, async mfaVerify(){},
  async createSession(s){ const db=this.db(); s={id:uid(),created_at:now(),owner_id:"demo",...s}; db.sessions.push(s); this.save(db); return s; },
  async getMySession(code){ return this.db().sessions.find(s=>s.code===code.toUpperCase())||null; },
  async lookupSession(code){ return this.getMySession(code); },
  async listMySessions(){ return [...this.db().sessions].sort((a,b)=>a.created_at<b.created_at?1:-1); },
  async updateSession(id,patch){ const db=this.db(); const s=db.sessions.find(x=>x.id===id); if(s) Object.assign(s,patch); this.save(db); },
  async deleteSession(id){ const db=this.db(); ["participants","cards","votes","qw","ideas","ideaVotes"].forEach(k=>db[k]=db[k].filter(x=>x.session_id!==id)); db.sessions=db.sessions.filter(s=>s.id!==id); this.save(db); },
  async joinParticipant(p){ const db=this.db(); p={id:uid(),joined_at:now(),user_id:this._uid(),...p}; db.participants.push(p); this.save(db); return p; },
  async myParticipant(sid){ const me=this._uid(); return this.db().participants.find(p=>p.session_id===sid && p.user_id===me)||null; },
  async updateParticipant(id,patch){ const db=this.db(); const p=db.participants.find(x=>x.id===id); if(p) Object.assign(p,patch); this.save(db); },
  async listParticipants(sid){ return this.db().participants.filter(p=>p.session_id===sid); },
  async addCard(c){ const db=this.db(); c={id:uid(),created_at:now(),...c}; db.cards.push(c); this.save(db); return c; },
  async deleteCard(id){ const db=this.db(); const gone=new Set(db.ideas.filter(i=>i.card_id===id).map(i=>i.id)); db.cards=db.cards.filter(c=>c.id!==id); db.votes=db.votes.filter(v=>v.card_id!==id); db.ideas=db.ideas.filter(i=>!gone.has(i.id)); db.ideaVotes=db.ideaVotes.filter(v=>!gone.has(v.idea_id)); this.save(db); },
  async listCards(sid){ return this.db().cards.filter(c=>c.session_id===sid); },
  async setVote(v){ const db=this.db(); const i=db.votes.findIndex(x=>x.session_id===v.session_id&&x.participant_id===v.participant_id&&x.card_id===v.card_id); if(i>=0){ if(v.points<=0) db.votes.splice(i,1); else db.votes[i].points=v.points; } else if(v.points>0){ db.votes.push({id:uid(),...v}); } this.save(db); },
  async listMyVotes(sid,pid){ return this.db().votes.filter(v=>v.session_id===sid && v.participant_id===pid); },
  async listVotes(sid){ return this.db().votes.filter(v=>v.session_id===sid); },
  async cardTotals(sid){ const t={}; this.db().votes.filter(v=>v.session_id===sid).forEach(v=>t[v.card_id]=(t[v.card_id]||0)+(v.points||0)); return t; },

  async setQwRating(r){ const db=this.db(); const i=db.qw.findIndex(x=>x.session_id===r.session_id&&x.participant_id===r.participant_id&&x.qw_id===r.qw_id); if(i>=0) db.qw[i].score=r.score; else db.qw.push({id:uid(),created_at:now(),...r}); this.save(db); },
  async phaseProgress(sid){ const db=this.db(); const s=db.sessions.find(x=>x.id===sid); if(!s) return null; const ps=db.participants.filter(p=>p.session_id===sid); return {phase:s.phase,total:ps.length,listos:ps.filter(p=>(p.done_phases||[]).includes(s.phase)).length}; },
  async listMyQwRatings(sid,pid){ return this.db().qw.filter(r=>r.session_id===sid&&r.participant_id===pid); },
  async listQwRatings(sid){ return this.db().qw.filter(r=>r.session_id===sid); },
  async qwTotals(sid){ return qwCount(this.db().qw.filter(r=>r.session_id===sid)); },
  async addIdea(i){ const db=this.db(); i={id:uid(),created_at:now(),...i}; if(i.kind!=="idea") i.card_id=null; db.ideas.push(i); this.save(db); return i; },
  async deleteIdea(id){ const db=this.db(); db.ideas=db.ideas.filter(i=>i.id!==id); db.ideaVotes=db.ideaVotes.filter(v=>v.idea_id!==id); this.save(db); },
  async listIdeas(sid){ return this.db().ideas.filter(i=>i.session_id===sid); },
  async listMyIdeaVotes(sid,pid){ return this.db().ideaVotes.filter(v=>v.session_id===sid&&v.participant_id===pid); },
  async listIdeaVotes(sid){ return this.db().ideaVotes.filter(v=>v.session_id===sid); },
  async setIdeaVote(v,on){ const db=this.db(); const i=db.ideaVotes.findIndex(x=>x.session_id===v.session_id&&x.participant_id===v.participant_id&&x.idea_id===v.idea_id);
    if(on){ const s=db.sessions.find(x=>x.id===v.session_id)||{}; const used=db.ideaVotes.filter(x=>x.session_id===v.session_id&&x.participant_id===v.participant_id).length;
      const idea=db.ideas.find(x=>x.id===v.idea_id); if(idea && idea.participant_id===v.participant_id) throw new Error("No puedes apoyar tu propia idea");
      if(i<0){ if(used>=(s.idea_votes||3)) throw new Error("Ya usaste todos tus apoyos"); db.ideaVotes.push({id:uid(),...v}); } }
    else if(i>=0) db.ideaVotes.splice(i,1);
    this.save(db); },
  async ideaTotals(sid){ const t={}; this.db().ideaVotes.filter(v=>v.session_id===sid).forEach(v=>t[v.idea_id]=(t[v.idea_id]||0)+1); return t; },
  subscribe(sid,cb){ this._cbs.push(cb); return ()=>{ this._cbs=this._cbs.filter(x=>x!==cb); }; }
};

const Store = HAS_SUPA ? SupaStore : DemoStore;
Store.init();
if(!HAS_SUPA){
  $("#banner").innerHTML = '<div class="banner-demo">Modo demo: sin base de datos conectada — lo que captures vive solo en este navegador. Sigue el README para conectar Supabase.</div>';
}

</script>
<script>
/* ============================================================
   Flujo del participante (móvil)
   ============================================================ */
const P = { session:null, me:null, step:0,
  form:{nombre:"",apellido:"",area:"",rol:"",etapas:[],emoji:""},
  cards:[], votes:[], myCards:[], unsub:null, poll:null, sending:false,
  qw:{ratings:{}, step:0}, ideas:{targets:[], reto:0, list:[], mine:new Set()},
  progress:null, banner:null };

/* Las 5 actividades del taller tal como las vive el participante (lobby, resultados y cierre no cuentan) */
const ACTS = [
  {id:"checkin",   t:"Check-in",   intro:"Un toque y una frase."},
  {id:"pains",     t:"Dolores",    intro:"Una idea por tarjeta, las que quieras."},
  {id:"votes",     t:"Votación",   intro:s=>`Tienes ${s.votes_per_user||5} votos para repartir.`},
  {id:"quickwins", t:"Validación", intro:s=>`${(s.quickwins||[]).length} preguntas de un toque.`},
  {id:"ideas",     t:"Ideas",      intro:"Propón cómo resolver los dolores más votados y apoya ideas."}
];
const actIndex = ph => ACTS.findIndex(a=>a.id===ph);
const facName = () => esc((P.session&&P.session.facilitator)||"quien facilita");
function nextActOf(ph){ const i=actIndex(ph); return i>=0 && i<ACTS.length-1 ? ACTS[i+1].t : "Resultados"; }

/* Barra superior: en las actividades dice «Actividad N de 5 · Nombre», con 5 segmentos y el estado */
function pTop(withDots, totalDots, onDot, status){
  const s=P.session, ph=s&&s.phase, i=actIndex(ph);
  if(withDots || i<0 || !P.me){
    return `<div class="p-top">
      ${brandLockup("xs")}
      <span class="sname">${esc(s? s.name : CONFIG.BRAND)}</span>
      ${withDots?`<span class="dots">${Array.from({length:totalDots},(_,i)=>`<span class="dot ${i<=onDot?"on":""}"></span>`).join("")}</span>`:""}
    </div>`;
  }
  const st=status||"curso";
  return `<div class="p-top pbar">
    <div class="pb-row">${brandLockup("xs")}<span class="pb-pill ${st}" id="pbPill">${st==="listo"?"Listo ✓":st==="espera"?"Esperando":"En curso"}</span></div>
    <p class="pb-t">Actividad ${i+1} de ${ACTS.length} · <b>${ACTS[i].t}</b></p>
    <div class="pb-segs" aria-hidden="true">${ACTS.map((a,k)=>`<span class="pb-seg ${k<i?"done":k===i?"cur":""}"><i></i><em>${a.t}</em></span>`).join("")}</div>
    ${P.banner===ph?`<div class="pb-new" id="pbNew"><b>${i===ACTS.length-1?"Última actividad":"Nueva actividad"}: ${ACTS[i].t}.</b> ${typeof ACTS[i].intro==="function"?ACTS[i].intro(s):ACTS[i].intro}</div>`:""}
  </div>`;
}
function armBanner(){ const el=$("#pbNew"); if(el){ P.banner=null; setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),400); },4500); } }
function setPill(st){ const el=$("#pbPill"); if(!el) return; el.className="pb-pill "+st; el.textContent = st==="listo"?"Listo ✓":st==="espera"?"Esperando":"En curso"; }

/* «X de N ya terminaron»: números de la base (nunca nombres), se refrescan con el sondeo */
function peersText(){
  const pr=P.progress; if(!pr || pr.phase!==(P.session&&P.session.phase)) return "Contando a tus compañeros…";
  const me=(P.me.done_phases||[]).includes(pr.phase);
  if(pr.total<=1) return "Eres la única persona registrada por ahora.";
  if(pr.listos>=pr.total) return "Todos listos. En un momento cambia la pantalla.";
  if(me && pr.listos===1) return `Eres la primera persona en terminar; van ${pr.listos} de ${pr.total}.`;
  return `${pr.listos} de ${pr.total} ya terminaron.`;
}
async function loadProgress(){ try{ P.progress=await Store.phaseProgress(P.session.id); }catch(e){ return; } const el=$("#peers"); if(el) el.textContent=peersText(); }
function isDone(ph){ return (P.me&&P.me.done_phases||[]).includes(ph); }
async function setDone(ph,on){
  const cur=new Set(P.me.done_phases||[]); if(on===cur.has(ph)) return;
  if(on) cur.add(ph); else cur.delete(ph);
  const arr=[...cur]; P.me.done_phases=arr;
  try{ await Store.updateParticipant(P.me.id,{done_phases:arr}); }catch(e){ console.error(e); }
  loadProgress();
}
/* Bloque «terminé»: va al tope del contenido; lo de abajo sigue editable */
function doneBlock(o){
  return `<section class="dn" id="doneBlock">
    <div class="done-h">${glass("check",{size:"md",tone:"green",tint:true})}<div><h2>${o.title}</h2><p class="done-peers" id="peers">${peersText()}</p></div></div>
    ${o.sub?`<p class="done-sub">${o.sub}</p>`:""}
    ${o.next!==false?`<p class="done-next">Lo que sigue: <b>${o.next||nextActOf(P.session.phase)}</b>. ${facName()} abre la siguiente actividad cuando el grupo esté listo; tu pantalla cambia sola.</p>`:""}
    ${o.actions&&o.actions.length?`<div class="done-act">${o.actions.map(a=>`<button class="btn ${a.primary?"btn-primary":"btn-line"} btn-sm" id="${a.id}">${a.label}</button>`).join("")}</div>`:""}
  </section>`;
}
/* Borradores: lo que escribes sobrevive a la recarga y avisa si la fase se cierra */
const draftKey = ph => `colmena_draft_${P.session.id}_${ph}`;
const loadDraft = ph => storageGet(draftKey(ph))||"";
const saveDraft = (ph,v) => storageSet(draftKey(ph), v||"");
const clearDraft = ph => storageSet(draftKey(ph),"");
function bindDraft(el, ph){ if(!el) return; const d=loadDraft(ph); if(d && !el.value) el.value=d; el.addEventListener("input",()=>saveDraft(ph, el.value)); }
function lostDraftSheet(oldPh){
  const names={pains:"Dolores",quickwins:"Validación",ideas:"Ideas"}; const d=loadDraft(oldPh); if(!names[oldPh] || d.trim().length<8) return;
  clearDraft(oldPh);
  const sheet=document.createElement("div"); sheet.className="sheet"; sheet.innerHTML=`<div class="sheet-card"><h3>${facName()} cerró ${names[oldPh]}</h3>
    <p>Tu texto no se publicó:</p><blockquote>${esc(d)}</blockquote>
    <div class="done-act"><button class="btn btn-line btn-sm" id="shCopy">Copiar texto</button><button class="btn btn-primary btn-sm" id="shOk">Entendido</button></div></div>`;
  document.body.appendChild(sheet);
  sheet.querySelector("#shOk").onclick=()=>sheet.remove();
  sheet.querySelector("#shCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(d); toast("Texto copiado"); }catch(e){ toast("No se pudo copiar"); } };
}

function screenJoin(msg){
  $("#app").innerHTML = `<div class="p-shell">${pTop(false)}
    <div class="p-body">
      <p class="p-kicker">Bienvenido</p>
      <h1 class="p-title">Entra a la sesión</h1>
      <p class="p-sub">Escanea el QR que está en pantalla o escribe el código de la sesión.</p>
      <div class="field"><label for="jcode">Código de sesión</label>
        <input id="jcode" class="input" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="ABC123" style="letter-spacing:.25em;font-weight:700;text-align:center;font-size:22px">
      </div>
      ${msg?`<p class="err">${esc(msg)}</p>`:""}
    </div>
    <div class="p-cta"><button class="btn btn-primary" id="jgo">Entrar a la sesión</button></div>
  </div>`;
  $("#jcode").addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  $("#jgo").onclick = ()=>{ const c=$("#jcode").value.trim(); if(c.length<4) return toast("Escribe el código completo"); location.search="?s="+c; };
}

function screenWelcome(){
  const s=P.session;
  $("#app").innerHTML = `<div class="p-shell">${pTop(false)}
    <div class="p-body wait-hero">
      ${glass("hexagon",{size:"xl",tint:true})}
      <h1 class="p-title" style="margin:0">${esc(s.name)}</h1>
      <p class="p-sub" style="margin:0">${actIndex(s.phase)>0||["results","closed"].includes(s.phase)?`El taller ya va en ${s.phase==="results"?"los resultados":`la actividad ${actIndex(s.phase)+1} de ${ACTS.length}`}. Regístrate en un minuto y te unes donde va.`:`Facilita ${esc(s.facilitator||"el equipo")}. Tus respuestas se guardan al instante y se ven en la pantalla de la sala.`}</p>
    </div>
    <div class="p-cta"><button class="btn btn-primary" id="wgo">Comenzar</button></div>
  </div>`;
  $("#wgo").onclick=()=>{ P.step=0; renderOnboarding(); };
}

/* ---------- Onboarding: los pasos dependen de cómo se configuró el taller ---------- */
function stepPickOne({key, title, sub, opts, otherLabel, otherField, placeholder}){
  return {
    title, sub,
    body:()=>{ const cur=P.form[key]; const isOther = !!cur && !opts.includes(cur);
      return `<div class="chips" id="f-${key}">${opts.map(a=>`<button class="chip ${cur===a?"on":""}" data-a="${esc(a)}">${esc(a)}</button>`).join("")}<button class="chip ${isOther?"on":""}" data-a="__otra">${otherLabel}</button></div>
      <div class="field" id="f-${key}-wrap" style="margin-top:14px;display:${isOther?"block":"none"}"><label for="f-${key}-otra">${otherField}</label><input id="f-${key}-otra" class="input" value="${esc(isOther?cur:"")}" placeholder="${esc(placeholder||"")}"></div>`; },
    wire:()=>{
      $$(`#f-${key} .chip`).forEach(ch=>ch.onclick=()=>{ const v=ch.dataset.a;
        if(v==="__otra"){ $(`#f-${key}-wrap`).style.display="block"; $$(`#f-${key} .chip`).forEach(x=>x.classList.remove("on")); ch.classList.add("on"); P.form[key]=$(`#f-${key}-otra`).value.trim(); $(`#f-${key}-otra`).focus(); }
        else { P.form[key]=v; $(`#f-${key}-wrap`).style.display="none"; $$(`#f-${key} .chip`).forEach(x=>x.classList.toggle("on",x===ch)); }
        refreshCTA(); });
      const o=$(`#f-${key}-otra`); if(o) o.addEventListener("input",()=>{ P.form[key]=o.value.trim(); refreshCTA(); });
    },
    read:()=>{}, valid:()=>P.form[key].length>=2
  };
}

function obSteps(){
  const s=P.session, roles=s.roles||[], stages=s.stages||[];
  const steps=[{
    title:"¿Cómo te llamas?", sub:"Así aparecerás en el muro de la sala.",
    body:()=>`
      <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" class="input" value="${esc(P.form.nombre)}" autocomplete="given-name"></div>
      <div class="field"><label for="f-apellido">Apellido</label><input id="f-apellido" class="input" value="${esc(P.form.apellido)}" autocomplete="family-name"></div>`,
    read:()=>{ P.form.nombre=$("#f-nombre").value.trim(); P.form.apellido=$("#f-apellido").value.trim(); },
    valid:()=>P.form.nombre.length>=2
  },
  stepPickOne({key:"area", title:"¿En qué área trabajas?", sub:"Elige la más cercana a tu día a día.", opts:s.areas||[], otherLabel:"Otra…", otherField:"Tu área"})];
  if(roles.length){
    steps.push(stepPickOne({key:"rol", title:"¿Cuál es tu rol?", sub:"Nos ayuda a leer los resultados por rol.", opts:roles, otherLabel:"Otro…", otherField:"Tu puesto", placeholder:"Ej. Analista de facturación"}));
  } else {
    steps.push({
      title:"¿Cuál es tu puesto?", sub:"Nos ayuda a leer los dolores por rol.",
      body:()=>`<div class="field"><label for="f-rol">Puesto o rol</label><input id="f-rol" class="input" value="${esc(P.form.rol)}" placeholder="Ej. Gerente, Analista…"></div>`,
      read:()=>{ P.form.rol=$("#f-rol").value.trim(); }, valid:()=>P.form.rol.length>=2
    });
  }
  if(stages.length){
    steps.push({
      title:"¿En qué etapas participas?", sub:`Elige todas las que apliquen (${stages.length} etapas). Así te mostramos solo lo que te toca.`,
      body:()=>`<div class="chips chips-tall" id="f-etapas"><button class="chip chip-all ${P.form.etapas.length===stages.length?"on":""}" id="f-etapas-all">${P.form.etapas.length===stages.length?"Quitar todas":"Participo en todas"}</button>${stages.map(t=>`<button class="chip ${P.form.etapas.includes(t)?"on":""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>`,
      wire:()=>{
        const allBtn=()=>{ const b=$("#f-etapas-all"); const all=P.form.etapas.length===stages.length; b.textContent = all ? "Quitar todas" : "Participo en todas"; b.classList.toggle("on",all); };
        $$("#f-etapas .chip[data-t]").forEach(ch=>ch.onclick=()=>{ const t=ch.dataset.t;
          P.form.etapas = P.form.etapas.includes(t) ? P.form.etapas.filter(x=>x!==t) : [...P.form.etapas, t];
          ch.classList.toggle("on", P.form.etapas.includes(t)); allBtn(); refreshCTA(); });
        $("#f-etapas-all").onclick=()=>{ P.form.etapas = P.form.etapas.length===stages.length ? [] : [...stages];
          $$("#f-etapas .chip[data-t]").forEach(x=>x.classList.toggle("on", P.form.etapas.length>0)); allBtn(); refreshCTA(); };
      },
      read:()=>{}, valid:()=>P.form.etapas.length>=1
    });
  }
  steps.push({
    title:"Elige tu avatar", sub:"Tu celda en la colmena.",
    body:()=>`<div class="avatar-grid">${AVATARS.map(a=>`<button class="avatar-pick ${P.form.emoji===a.id?"on":""}" data-e="${a.id}" aria-label="Avatar ${a.id}" aria-pressed="${P.form.emoji===a.id}">${avatar(a.id,"lg")}</button>`).join("")}</div>`,
    wire:()=>{ $$(".avatar-pick").forEach(b=>b.onclick=()=>{ P.form.emoji=b.dataset.e; $$(".avatar-pick").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-pressed",x===b); }); refreshCTA(); }); },
    read:()=>{}, valid:()=>!!P.form.emoji
  });
  return steps;
}

const OB_HINTS={"¿Cómo te llamas?":"Escribe tu nombre para continuar","¿En qué área trabajas?":"Elige un área para continuar","¿Cuál es tu rol?":"Elige tu rol para continuar","¿Cuál es tu puesto?":"Escribe tu puesto para continuar","¿En qué etapas participas?":"Elige al menos una etapa","Elige tu avatar":"Toca un avatar para continuar"};
function refreshCTA(){ const st=obSteps()[P.step]; const b=$("#obNext"); if(b && st){ b.disabled = !st.valid(); const h=$("#obHint"); if(h) h.textContent = b.disabled ? (OB_HINTS[st.title]||"") : ""; } }

function renderOnboarding(){
  const steps=obSteps(), st=steps[P.step];
  $("#app").innerHTML = `<div class="p-shell${st.title.includes("etapas")?" tall-cta":""}">${pTop(true, steps.length, P.step)}
    <div class="p-body">
      <p class="p-kicker">Paso ${P.step+1} de ${steps.length}</p>
      <h1 class="p-title">${st.title}</h1>
      <p class="p-sub">${st.sub}</p>
      ${st.body()}
    </div>
    <div class="p-cta">
      <button class="btn btn-primary" id="obNext">${P.step===steps.length-1?"Entrar a la colmena":"Continuar"}</button>
      <p class="cta-hint" id="obHint"></p>
      ${P.step>0?'<button class="btn btn-ghost" id="obBack">Regresar</button>':""}
    </div>
  </div>`;
  if(st.wire) st.wire();
  $$(".p-body .input").forEach(i=>i.addEventListener("input",()=>{ st.read(); refreshCTA(); }));
  refreshCTA();
  const back=$("#obBack"); if(back) back.onclick=()=>{ st.read(); P.step--; renderOnboarding(); };
  $("#obNext").onclick = async ()=>{
    st.read(); if(!st.valid()) return;
    if(P.step<steps.length-1){ P.step++; renderOnboarding(); return; }
    if(P.sending) return; P.sending=true; $("#obNext").disabled=true;
    try{
      const me = await Store.joinParticipant({ session_id:P.session.id, nombre:P.form.nombre, apellido:P.form.apellido,
        area:P.form.area, rol:P.form.rol, etapas:P.form.etapas, emoji:P.form.emoji });
      P.me=me; P.banner=P.session.phase;
      renderPhase();
    }catch(e){ console.error(e); toast(friendlyAuthError(e).startsWith("No hay conexión")?friendlyAuthError(e):"No se pudo entrar. Intenta de nuevo."); }
    finally{ P.sending=false; }
  };
}

/* Mapa del proceso en el lobby: los pasos numerados en orden, con los tuyos resaltados; lo demás (Alta, Transversal) al final */
function processMap(s){
  const stages=s.stages||[]; if(stages.length<3) return "";
  const mine=new Set(P.me.etapas||[]);
  const num=stages.filter(t=>/^\d+\s/.test(t)), other=stages.filter(t=>!/^\d+\s/.test(t));
  const item=t=>{ const m=t.match(/^(\d+)\s+(.+)$/); return `<li class="${mine.has(t)?"mine":""}"><span class="pm-n">${m?esc(m[1]):"·"}</span><span class="pm-t">${esc(m?m[2]:t)}</span>${mine.has(t)?'<span class="pm-you">participas</span>':""}</li>`; };
  return `<section class="pmap">
    <p class="p-kicker">Así vemos el proceso</p>
    <p class="p-sub" style="margin:0 0 12px">En cada paso te vamos a preguntar qué duele, qué mejora ayudaría y cuánto tarda. Los marcados son en los que dijiste que participas.</p>
    <ol class="pm-list">${num.map(item).join("")}</ol>
    ${other.length?`<p class="pm-other">También: ${other.map(t=>`<span class="${mine.has(t)?"mine":""}">${esc(t.replace(/\s*\(.*\)$/,""))}</span>`).join(" · ")}</p>`:""}
  </section>`;
}

/* Recordar dónde iba el scroll cuando se vuelve a pintar la misma actividad (votos, ideas, resultados) */
function keepScroll(fn){ const y=window.scrollY; fn(); requestAnimationFrame(()=>window.scrollTo(0,y)); }

async function renderPhase(){
  const s=P.session, ph=s.phase||"lobby";
  if(!P.me){ screenWelcome(); return; }
  const changed = P.lastPh!==undefined && P.lastPh!==ph;
  if(changed){
    const old=P.lastPh; window.scrollTo(0,0);
    if(actIndex(ph)>=0) P.banner=ph;
    P.qw.step=0; P.qw.review=false;
    setTimeout(()=>lostDraftSheet(old),300);
  }
  P.lastPh=ph;
  if(actIndex(ph)>=0) loadProgress();
  if(ph==="lobby"){
    $("#app").innerHTML = `<div class="p-shell">${pTop(false)}
      ${waitBlock(avatar(P.me.emoji,"xl"), "Ya estás dentro, "+esc(P.me.nombre), "Son "+ACTS.length+" actividades cortas. Cuando "+facName()+" abra la primera, tu pantalla cambia sola.")}
      ${processMap(s)}
    </div>`;
    return;
  }
  if(ph==="checkin") return renderCheckin();
  if(ph==="pains") return renderPains();
  if(ph==="votes") return renderVotes();
  if(ph==="quickwins") return renderQuickwins();
  if(ph==="ideas") return renderIdeas();
  if(ph==="results") return renderResults();
  /* closed */
  $("#app").innerHTML = `<div class="p-shell">${pTop(false)}
    ${waitBlock(glass("sparkle",{size:"xl",tint:true}),"Gracias, "+esc(P.me.nombre),"La sesión terminó. Lo que aportaste ya quedó guardado y trabajaremos sobre ello. Puedes cerrar esta pestaña.")}
  </div>`;
}

/* ---------- Votación: reparte tus votos; al llegar a cero, listo ---------- */
async function renderVotes(){
  const s=P.session;
  [P.cards,P.votes] = await Promise.all([Store.listCards(s.id), Store.listMyVotes(s.id, P.me.id)]);
  const mine = P.votes;
  const used = mine.reduce((a,v)=>a+(v.points||0),0);
  const total = s.votes_per_user||5;
  const left = Math.max(0,total-used);
  const my = Object.fromEntries(mine.map(v=>[v.card_id,v.points||0]));
  const cards=[...P.cards].sort((a,b)=>a.id<b.id?-1:1);
  const done = left===0 && cards.length>0;
  if(done!==isDone("votes")) setDone("votes",done);
  const draw=()=>{ $("#app").innerHTML = `<div class="p-shell">${pTop(false,0,0,done?"listo":"curso")}
    <div class="sticky-votes"><span>${done?"Repartiste tus":"Te quedan"}</span>
      <span class="honeycells" aria-label="${left} de ${total} votos disponibles">${Array.from({length:total},(_,i)=>`<span class="honeycell ${i<left?"full":""}"></span>`).join("")}</span>
      <span style="color:var(--ink-2);font-weight:600">${done?`${total} votos`:`${left} de ${total} votos`}</span></div>
    <div class="p-body">
      ${done?doneBlock({title:"Terminaste la votación", sub:"Puedes mover tus votos mientras la actividad siga abierta."})
            :`<p class="p-sub" style="margin-bottom:14px">Reparte tus <b>${total} votos</b> entre los dolores que más te pesan a ti también. Puedes poner más de uno a la misma tarjeta; al usar el último, quedas listo.</p>`}
      ${cards.length? cards.map(c=>{
        const m=my[c.id]||0;
        return `<div class="votecard ${m>0?"voted":""}">
          <div class="txt">${esc(c.texto)}</div>
          <div class="meta-row"><span class="tag">${esc(c.etapa)}</span>${c.actividad?`<span class="tag tool">${taskHTML(c.actividad)}</span>`:""}${c.herramienta?`<span class="tag tool">${esc(c.herramienta)}</span>`:""}<span class="tag sev">Dolor ${c.severidad}/5</span></div>
          <div class="vote-ctrl">
            <button class="vbtn" data-id="${c.id}" data-d="-1" ${m<=0?"disabled":""} aria-label="quitar voto">−</button>
            <span class="vcount">${m>0?`<span class="vhex"></span> ${m} voto${m===1?"":"s"}`:`<span style="color:var(--ink-3);font-weight:600">Sin votos</span>`}</span>
            <button class="vbtn" data-id="${c.id}" data-d="1" ${left<=0?"disabled":""} aria-label="dar voto">+</button>
          </div></div>`;
      }).join("") : emptyWait("Aún no hay tarjetas para votar.")}
    </div>
  </div>`; };
  if(P.lastVotesDraw && !P.banner && !P.votesTop) keepScroll(draw); else { draw(); if(P.votesTop) window.scrollTo(0,0); }
  P.lastVotesDraw=true; P.votesTop=false; armBanner();
  $$(".vbtn").forEach(b=>b.onclick=async()=>{
    if(P.sending) return; P.sending=true;
    const id=b.dataset.id, d=+b.dataset.d, cur=my[id]||0, next=cur+d;
    if(next<0 || (d>0 && left<=0)){ P.sending=false; return; }
    try{ await Store.setVote({session_id:s.id, participant_id:P.me.id, card_id:id, points:next}); }
    catch(e){ toast(/votos/.test(String(e&&e.message))?"Ya usaste todos tus votos":"No se pudo guardar el voto"); }
    P.sending=false; P.votesTop = left-d===0 && !done; renderVotes();
  });
}

/* ---------- Validación: tres pasos (mejoras rápidas, reglas, tiempos) + propuesta opcional ---------- */
function qwCard(q){
  const cur=P.qw.ratings[q.id], K=RATING_KINDS[kindOf(q)];
  return `<div class="qwcard ${cur!==undefined?"done":""}${K.scale.length===4&&K.na===null?" seg4":""}" data-q="${esc(q.id)}">
    <div class="txt">${esc(q.text)}</div>
    ${q.help?`<details class="qhelp"><summary>¿Qué significa?</summary><p>${esc(q.help)}</p></details>`:""}
    <div class="seg" role="group" aria-label="${esc(K.q)}">${K.scale.map(o=>`<button data-v="${o.v}" class="${cur===o.v?"on":""}" aria-pressed="${cur===o.v}">${o.t}</button>`).join("")}</div>
  </div>`;
}
function qwGroup(list){
  const byStage=[]; list.forEach(q=>{ let g=byStage.find(x=>x.stage===q.stage); if(!g){ g={stage:q.stage,items:[]}; byStage.push(g); } g.items.push(q); });
  const oneKind=new Set(list.map(kindOf)).size===1 && kindOf(list[0])==="time";
  return byStage.map(g=>`${oneKind?"":`<p class="stage-h">${esc(g.stage)}</p>`}${g.items.map(qwCard).join("")}`).join("");
}
/* Una sección por tipo de lista: primero lo de tus etapas, lo demás plegado */
function ratingSection(kind, items, et){
  if(!items.length) return "";
  const K=RATING_KINDS[kind];
  const hasMine = et.size && items.some(q=>et.has(q.stage));
  const mine = hasMine ? items.filter(q=>et.has(q.stage)) : items;
  const other = hasMine ? items.filter(q=>!et.has(q.stage)) : [];
  return `<section class="rsec" data-kind="${kind}">
    <h2 class="p-title" style="font-size:22px">${esc(K.q)}</h2>
    <p class="p-sub">${esc(K.h)}${hasMine&&kind!=="time"?" Primero lo de tus etapas.":""}</p>
    ${qwGroup(mine)}
    ${other.length?`<details class="more"><summary>Ver ${kind==="time"?"otras etapas":"lo de otras etapas"} (${other.length})</summary>${qwGroup(other)}</details>`:""}
  </section>`;
}
const KIND_SHORT={qw:"Mejoras rápidas",gate:"Reglas",time:"Tiempos"};
async function renderQuickwins(){
  const s=P.session, qws=s.quickwins||[];
  const [mine, ideas] = await Promise.all([Store.listMyQwRatings(s.id,P.me.id), Store.listIdeas(s.id)]);
  P.qw.ratings = Object.fromEntries(mine.map(r=>[r.qw_id, r.score]));
  const myProps = ideas.filter(i=>i.kind==="qw" && i.participant_id===P.me.id);
  const et=new Set(P.me.etapas||[]);
  const steps=["qw","gate","time"].filter(k=>qws.some(q=>kindOf(q)===k));
  const anyMine = et.size && qws.some(q=>et.has(q.stage));
  const toDo = k => (anyMine ? qws.filter(q=>et.has(q.stage)) : qws).filter(q=>kindOf(q)===k);   /* lo que te toca en este paso */
  const answered = list => list.filter(q=>P.qw.ratings[q.id]!==undefined).length;
  const allMine = steps.flatMap(toDo);
  const done = isDone("quickwins") && !P.qw.review;
  if(P.qw.step>=steps.length) P.qw.step=Math.max(0,steps.length-1);
  const k=steps[P.qw.step], K=k&&RATING_KINDS[k], list=k?toDo(k):[];
  const last=P.qw.step===steps.length-1;
  let pStage="";
  const proposal=`<section class="propose">
      <h2 class="sec-title" style="margin-top:22px">${qws.length?"¿Falta alguna mejora rápida?":"¿Qué mejora rápida propones?"} <span class="opt">(opcional)</span></h2>
      <p class="p-sub" style="margin-bottom:14px">Propón la que más te ayudaría en tu día a día. Solo la ve quien facilita.</p>
      <div class="field"><label for="f-qwnew">Tu propuesta</label>
        <textarea id="f-qwnew" class="input" maxlength="240" placeholder="Ej. Que el layout valide los datos al subirlo…"></textarea></div>
      ${(s.stages||[]).length?`<div class="field"><label>¿En qué etapa? <span class="opt">(opcional)</span></label>
        <div class="chips" id="f-qwstage">${s.stages.map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`:""}
      <button class="btn btn-line" id="qwPropose" disabled>Enviar propuesta</button>

      <div class="p-body">
        ${isDone("quickwins")?doneBlock({title:"Terminaste la validación", sub:qws.length?`Contestaste ${answered(allMine)} de ${allMine.length}.${answered(allMine)<allMine.length?" Puedes volver y completar las que faltan.":""}`:"", actions:qws.length?[{id:"qwReview",label:"Revisar mis respuestas"}]:[]})
          :`<p class="p-kicker">Validación</p><h1 class="p-title" style="font-size:26px">¿Qué mejora rápida propones?</h1>`}
        ${proposal}
        ${!qws.length&&!isDone("quickwins")?`<div class="p-cta" style="position:static;padding:16px 0 0"><button class="btn btn-primary" id="qwFinish">Terminar validación</button></div>`:""}
      </div></div>`;
    armBanner(); bindProposal(); 
    const r=$("#qwReview"); if(r) r.onclick=()=>{ P.qw.review=true; P.qw.step=0; window.scrollTo(0,0); renderQuickwins(); };
    const f=$("#qwFinish"); if(f) f.onclick=async()=>{ await setDone("quickwins",true); window.scrollTo(0,0); renderQuickwins(); };
    return;
  }
  $("#app").innerHTML = `<div class="p-shell tall-cta">${pTop(false,0,0,isDone("quickwins")?"listo":"curso")}
    <div class="sticky-votes qw-band"><span>Paso ${P.qw.step+1} de ${steps.length} · <b>${KIND_SHORT[k]}</b></span><span class="qw-n"><b id="qwDone">${answered(list)}</b> de ${list.length}</span></div>
    <div class="p-body">
      ${P.qw.step===0?`<p class="p-sub" style="margin:0 0 4px">${steps.length} paso${steps.length===1?"":"s"}: ${steps.map(x=>KIND_SHORT[x].toLowerCase()).join(", ").replace(/, ([^,]*)$/," y $1")}. Contesta desde tu experiencia; son unos minutos.</p>`:""}
      ${ratingSection(k, qws.filter(q=>kindOf(q)===k), et)}
    </div>
    <div class="p-cta">
      <button class="btn btn-line" id="qwNextQ" ${answered(list)<list.length?"":"disabled"}>Siguiente sin contestar</button>
      <button class="btn btn-primary" id="qwCont">${last?"Terminar validación":`Continuar a ${KIND_SHORT[steps[P.qw.step+1]]}`}</button>
      <p class="cta-hint" id="qwHint"></p>
    </div>
  </div>`;
  armBanner();
  const hint=()=>{ const a=answered(list), n=list.length-a; $("#qwDone").textContent=a; $("#qwNextQ").disabled=n===0;
    $("#qwHint").textContent = n? `Te falta${n===1?"":"n"} ${n}. Puedes continuar y volver después.` : (last?"":"Todo contestado en este paso."); };
  hint();
  $$(".qwcard .seg button").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".qwcard"), id=card.dataset.q, v=+b.dataset.v, prev=P.qw.ratings[id];

    catch(e){ console.error(e); toast("No se guardó tu respuesta. Intenta de nuevo.");
      if(prev===undefined){ delete P.qw.ratings[id]; card.classList.remove("done"); } else P.qw.ratings[id]=prev;
      $$("button",card).forEach(x=>{ const on=+x.dataset.v===P.qw.ratings[id]; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on); });

  });

  $("#qwCont").onclick=async()=>{ if(last){ await setDone("quickwins",true); P.qw.review=false; } else P.qw.step++; window.scrollTo(0,0); renderQuickwins(); };

  function bindProposal(){

    const ta=$("#f-qwnew"); bindDraft(ta,"quickwins"); const chk=()=>{ $("#qwPropose").disabled = ta.value.trim().length<8; }; ta.addEventListener("input",chk); chk();
    $("#qwPropose").onclick=async()=>{ if(P.sending) return; P.sending=true; $("#qwPropose").disabled=true;

async function refreshIdeas(){
  const s=P.session;
  try{
    const [ideas, mv] = await Promise.all([Store.listIdeas(s.id), Store.listMyIdeaVotes(s.id, P.me.id)]);
    P.ideas.list = ideas.filter(i=>i.kind==="idea");
    P.ideas.mine = new Set(mv.map(v=>v.idea_id));
  }catch(e){ return; }
  drawIdeaList();
}
function drawIdeaList(){
  const s=P.session, T=P.ideas.targets; if(!T.length || !$("#ideaList")) return;
  const total=s.idea_votes||3, left=Math.max(0,total-P.ideas.mine.size);
  $("#supBar").innerHTML = `<span>${left?"Te quedan":"Usaste tus"}</span>
    <span class="honeycells" aria-label="${left} de ${total} apoyos disponibles">${Array.from({length:total},(_,i)=>`<span class="honeycell ${i<left?"full":""}"></span>`).join("")}</span>
    <span style="color:var(--ink-2);font-weight:600">${left?`${left} de ${total} apoyos`:`${total} apoyos`}</span>`;
  const cid=T[P.ideas.reto].id;
  const list=P.ideas.list.filter(i=>i.card_id===cid).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  $("#ideaList").innerHTML = `<p class="mine-h">Ideas para este reto (${list.length})</p>`+
    (list.length ? list.map(i=>{ const own=i.participant_id===P.me.id, on=P.ideas.mine.has(i.id);
      return `<div class="ideacard"><div class="txt">${esc(i.texto)}</div><div class="meta-row">
        ${own?`<span class="tag mine">Tu idea</span><button class="del" data-del="${i.id}">Eliminar</button>`
             :`<button class="support ${on?"on":""}" data-sup="${i.id}" aria-pressed="${on}"><span class="vhex"></span>${on?"Apoyada":"Apoyar"}</button>`}
      </div></div>`; }).join("") : '<p class="empty">Sé la primera persona en proponer una idea para este reto.</p>');
  $$("#ideaList [data-sup]").forEach(b=>b.onclick=async()=>{
    if(P.sending) return; const id=b.dataset.sup, on=P.ideas.mine.has(id);
    if(!on && left<=0) return toast(`Ya usaste tus ${total} apoyos. Quita uno para apoyar otra idea.`);
    P.sending=true;
    try{ await Store.setIdeaVote({session_id:s.id, participant_id:P.me.id, idea_id:id}, !on); if(on) P.ideas.mine.delete(id); else P.ideas.mine.add(id); drawIdeaList(); }
    catch(e){ console.error(e); toast(/apoyos/.test(String(e&&e.message))?"Ya usaste todos tus apoyos":"No se pudo guardar tu apoyo"); }
    P.sending=false; });
  $$("#ideaList [data-del]").forEach(b=>b.onclick=async()=>{ try{ await Store.deleteIdea(b.dataset.del); await refreshIdeas(); }catch(e){ toast("No se pudo eliminar"); } });
}

/* ---------- Resultados: dolores, ideas, quick wins, reglas y tiempos ---------- */
async function renderResults(){
  const s=P.session;
  const safe = p => p.catch(()=>null);
  const [cards,totals,qwT,ideas,ideaT] = await Promise.all([Store.listCards(s.id), Store.cardTotals(s.id), safe(Store.qwTotals(s.id)), safe(Store.listIdeas(s.id)), safe(Store.ideaTotals(s.id))]);
  const top=topPains(cards, totals, 5);
  const rated=(s.quickwins||[]).map(q=>({...q, st:qwStats((qwT||{})[q.id], kindOf(q))})).filter(q=>q.st.idx!==null);
  const qws=rated.filter(q=>kindOf(q)==="qw").sort((a,b)=>b.st.idx-a.st.idx || b.st.m-a.st.m).slice(0,5);
  const gates=rated.filter(q=>kindOf(q)==="gate").sort((a,b)=>b.st.idx-a.st.idx);
  const gTop=gates.slice(0,3), gLow=gates.filter(g=>g.st.idx<50).slice(-3).reverse();
  const times=rated.filter(q=>kindOf(q)==="time").sort((a,b)=>b.st.idx-a.st.idx).slice(0,3);
  const topIdeas=(ideas||[]).filter(i=>i.kind==="idea").map(i=>({...i, v:(ideaT||{})[i.id]||0})).filter(i=>i.v>0)
    .sort((a,b)=>b.v-a.v).slice(0,5);
  const card = (n,txt,tags) => `<div class="mycard"><div class="txt"><strong>${n}.</strong> ${esc(txt)}</div><div class="meta-row">${tags}</div></div>`;
  const draw=()=>{ $("#app").innerHTML = `<div class="p-shell">${pTop(false)}
    <div class="p-body">
      <p class="p-kicker">Resultados</p>
      <h1 class="p-title">Lo que decidimos juntos</h1>
      <p class="p-sub">Esto marca la agenda de lo que sigue. Ya no hay nada que contestar: mira la pantalla de la sala.</p>
      <h2 class="sec-title" style="margin-top:4px">Lo que más nos duele</h2>
      ${top.length? top.map((c,i)=>card(i+1,c.texto,`<span class="tag">${esc(c.etapa)}</span><span class="tag sev">${c.pts} voto${c.pts===1?"":"s"}</span>`)).join("") : '<p class="empty">Sin votos registrados.</p>'}
      ${topIdeas.length?`<h2 class="sec-title">Ideas con más apoyo</h2>
        ${topIdeas.map((x,i)=>card(i+1,x.texto,`<span class="tag sev">${x.v} apoyo${x.v===1?"":"s"}</span>`)).join("")}`:""}
      ${qws.length?`<h2 class="sec-title">Quick wins que más ayudarían</h2>
        ${qws.map((q,i)=>card(i+1,q.text,`<span class="tag">${esc(q.stage)}</span><span class="tag sev">${q.st.n<3?`${q.st.n} respuesta${q.st.n===1?"":"s"}`:`Apoyo ${q.st.idx}/100`}</span>`)).join("")}`:""}
      ${gTop.length?`<h2 class="sec-title">Reglas del nuevo flujo con más acuerdo</h2>
        ${gTop.map((q,i)=>card(i+1,q.text,`<span class="tag">${esc(q.stage)}</span><span class="tag sev">${q.st.n<3?`${q.st.n} respuesta${q.st.n===1?"":"s"}`:`Acuerdo ${q.st.idx}/100`}</span>`)).join("")}
        ${gLow.length?`<p class="p-sub" style="margin-top:6px">Con menos acuerdo: ${gLow.map(q=>esc(q.text)).join(" · ")}</p>`:""}`:""}
      ${times.length?`<h2 class="sec-title">Las etapas que más tardan hoy</h2>
        ${times.map((q,i)=>card(i+1,q.text,`<span class="tag sev">Lo más común: ${esc(scaleLabel("time",q.st.mode))}</span>`)).join("")}`:""}
      <section class="dn end"><div class="done-h">${glass("sparkle",{size:"md",tint:true})}<div><h2>Esto es todo por hoy</h2><p class="done-peers">Gracias, ${esc(P.me.nombre)}. Todo lo que aportaste quedó guardado; ${facName()} cierra la sesión y puedes cerrar esta pestaña cuando quieras.</p></div></div></section>
    </div>
  </div>`; };
  if(P.lastResultsDraw) keepScroll(draw); else draw();
  P.lastResultsDraw=true;
}

async function startParticipant(code){
  let s=null;
  try{
    await Store.ensureAnon();                 /* identidad anónima: sin datos personales */
    s = await Store.lookupSession(code);
  }catch(e){ console.error(e); screenJoin(friendlyAuthError(e)); return; }
  if(!s){ screenJoin("No encontramos la sesión «"+code+"». Revisa el código."); return; }
  P.session=s;
  try{ P.me = await Store.myParticipant(s.id); }catch(e){ P.me=null; }
  if(!P.me && s.phase==="closed"){
    $("#app").innerHTML = `<div class="p-shell">${pTop(false)}${waitBlock(glass("flag",{size:"xl"}),"Esta sesión ya terminó","Gracias por tu interés. Si crees que es un error, avísale a quien facilita.")}</div>`;
    return;
  }
  const refresh = async ()=>{
    let ns=null; try{ ns=await Store.lookupSession(code); }catch(e){ setOffline(true); return; }
    setOffline(false);
    if(!ns) return;
    const changed=ns.phase!==P.session.phase; P.session=ns;
    if(!P.me) return;
    if(changed) return renderPhase();
    /* Misma actividad: solo se refresca el avance de compañeros y, en Ideas, la lista. Lo que escribes no se toca. */
    if(actIndex(ns.phase)>=0) loadProgress();
    if(ns.phase==="results") return renderPhase();
    if(ns.phase==="ideas") return refreshIdeas();
  };
  P.unsub = Store.subscribe(s.id, ()=>refresh());
  P.poll = setInterval(refresh, 7000);
  window.addEventListener("online",()=>setOffline(false)); window.addEventListener("offline",()=>setOffline(true));
  if(P.me) renderPhase(); else screenWelcome();
}
function setOffline(on){ let b=$("#offline"); if(on && !b){ b=document.createElement("div"); b.id="offline"; b.className="offline"; b.textContent="Sin conexión. Lo que contestes se enviará cuando vuelva."; document.body.appendChild(b); } if(!on && b) b.remove(); }

    </header>

        <div class="ah-sec">

            <div class="field"><label for="c-roles">Roles <span class="opt">uno por línea · vacío = texto libre</span></label><textarea id="c-roles" class="input" rows="7">${(pre.roles||[]).join("\n")}</textarea></div>

        <div class="ah-sec">
