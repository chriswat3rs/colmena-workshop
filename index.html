            <div class="field"><label for="c-tools">Herramientas por etapa <span class="opt">Etapa | herr1, herr2</span></label><textarea id="c-tools" class="input mono" rows="10">${toolsText(pre.tools)}</textarea></div>
          </div>
          <div class="field"><label for="c-tasks">Actividades por etapa <span class="opt">opcional · Etapa | actividad; actividad · cada dolor podrá señalar la actividad exacta</span></label><textarea id="c-tasks" class="input mono" rows="8">${tasksText(pre.tasks)}</textarea></div>
        </div>

        <details class="ah-sec" id="sec-qw">
          <summary class="ah-sec-t"><span>4</span> Validación e ideas <em class="opt" id="c-qwcount"></em></summary>
          <div class="field" style="margin-top:12px"><label for="c-qws">Listas a validar <span class="opt">Etapa | texto | explicación (opcional) · secciones «## Quick wins», «## Reglas» y «## Tiempos» · se numeran solos</span></label><textarea id="c-qws" class="input mono" rows="12">${qwsText(pre.quickwins)}</textarea></div>
          <div class="g3">
            <div class="field" style="grid-column:span 2"><label for="c-qidea">Pregunta de ideas</label><input id="c-qidea" class="input" value="${esc(pre.q_idea||"")}"></div>
            <div class="field"><label for="c-ivotes">Apoyos por persona</label><input id="c-ivotes" class="input" type="number" min="1" max="10" value="${pre.idea_votes||3}"></div>
          </div>
        </details>

        <details class="ah-sec">
          <summary class="ah-sec-t"><span>5</span> Preguntas a la sala</summary>
          <div class="field" style="margin-top:12px"><label for="c-qpain">Pregunta de dolores</label><textarea id="c-qpain" class="input" rows="2">${esc(pre.q_pain)}</textarea></div>
          <div class="grid2">
            <div class="field"><label for="c-qcheck">Check-in: estado de ánimo</label><input id="c-qcheck" class="input" value="${esc(pre.q_checkin)}"></div>
            <div class="field"><label for="c-qexp">Check-in: expectativa</label><input id="c-qexp" class="input" value="${esc(pre.q_expect)}"></div>
          </div>
        </details>

        <div class="ah-actions">
          <p class="hint">Al crearlo se genera un código de 6 caracteres y el QR para proyectar.</p>
          <button class="abtn primary ah-create" id="c-create">Crear taller</button>
        </div>
      </section>
    </main>
  </div>`;
  const summary=()=>{ const st=linesOf($("#c-stages").value).length, ar=linesOf($("#c-areas").value).length, ro=linesOf($("#c-roles").value).length, all=parseQws($("#c-qws").value), qw=all.filter(q=>q.kind==="qw").length, ex=all.length-qw;
    $("#c-summary").textContent=`${st} etapas · ${ar} áreas · ${ro||"sin"} roles · ${qw} quick wins${ex?` · ${ex} reglas y tiempos`:""}`; $("#c-qwcount").textContent=all.length?`· ${all.length}`:""; };
  $$(".ah-form .input").forEach(i=>i.addEventListener("input",summary));
  const fill = p => { $("#c-name").value=p.name; $("#c-fac").value=p.facilitator; $("#c-votes").value=p.votes_per_user;
    $("#c-areas").value=p.areas.join("\n"); $("#c-stages").value=p.stages.join("\n");
    $("#c-qpain").value=p.q_pain; $("#c-qcheck").value=p.q_checkin; $("#c-qexp").value=p.q_expect;
    $("#c-roles").value=(p.roles||[]).join("\n"); $("#c-tools").value=toolsText(p.tools); $("#c-tasks").value=tasksText(p.tasks); $("#c-qws").value=qwsText(p.quickwins);
    $("#c-qidea").value=p.q_idea||""; $("#c-ivotes").value=p.idea_votes||3; };
  const pick=(id,p)=>{ fill(p); $$(".ah-form-head .chip").forEach(x=>x.classList.toggle("on",x.id===id)); summary(); };
  $("#pre-lockton").onclick=()=>pick("pre-lockton",CONFIG.PRESETS.lockton);
  $("#pre-generic").onclick=()=>pick("pre-generic",CONFIG.PRESETS.generic);
  summary();
  $("#outBtn").onclick=async()=>{ await Store.signOut(); adminBoot(); };
  $$("[data-open]").forEach(b=>b.onclick=async()=>{ const s=await Store.getMySession(b.dataset.open).catch(()=>null); if(s) startAdmin(s); else toast("No se pudo abrir el taller"); });
  $("#c-create").onclick=async()=>{
    $("#c-create").disabled=true;
    const s={
      code:makeCode(), name:$("#c-name").value.trim()||"Taller", facilitator:$("#c-fac").value.trim(),
      phase:"lobby", votes_per_user:Math.max(1,Math.min(20,+$("#c-votes").value||5)),
      areas:$("#c-areas").value.split("\n").map(x=>x.trim()).filter(Boolean),
      stages:$("#c-stages").value.split("\n").map(x=>x.trim()).filter(Boolean),
      q_checkin:$("#c-qcheck").value.trim(), q_expect:$("#c-qexp").value.trim(), q_pain:$("#c-qpain").value.trim(),
      brand:CONFIG.BRAND,
      roles:linesOf($("#c-roles").value), tools:parseTools($("#c-tools").value), tasks:parseTasks($("#c-tasks").value), quickwins:parseQws($("#c-qws").value),
      q_idea:$("#c-qidea").value.trim()||"¿Cómo podríamos resolverlo?", idea_votes:Math.max(1,Math.min(10,+$("#c-ivotes").value||3)), idea_top:3
    };
    try{ const created=await Store.createSession(s); startAdmin(created); toast("Taller creado: "+created.code); }
    catch(e){ console.error(e); toast("No se pudo crear el taller: "+friendlyAuthError(e)); $("#c-create").disabled=false; }
  };
}

function toolsText(t){ return Object.entries(t||{}).map(([k,v])=>k+" | "+(v||[]).join(", ")).join("\n"); }
/* Listas a validar ↔ texto: secciones «## Quick wins» (QW), «## Reglas» (RG) y «## Tiempos» (TM); cada línea «Etapa | texto» */
const KIND_HEAD={qw:"## Quick wins",gate:"## Reglas",time:"## Tiempos"};
function qwsText(q){ q=q||[]; const kinds=["qw","gate","time"].filter(k=>q.some(x=>kindOf(x)===k)); const multi=kinds.length>1 || (kinds[0]&&kinds[0]!=="qw");
  return kinds.map(k=>(multi?KIND_HEAD[k]+"\n":"")+q.filter(x=>kindOf(x)===k).map(x=>(x.stage?x.stage+" | ":"")+x.text+(x.help?" | "+x.help:"")).join("\n")).join("\n"); }
function tasksText(t){ return Object.entries(t||{}).map(([k,v])=>k+" | "+(v||[]).join("; ")).join("\n"); }
function parseTasks(v){ const o={}; linesOf(v).forEach(l=>{ const i=l.indexOf("|"); if(i<0) return; const k=l.slice(0,i).trim(); const ts=l.slice(i+1).split(";").map(x=>x.trim()).filter(Boolean); if(k&&ts.length) o[k]=ts; }); return o; }
function parseTools(v){ const o={}; linesOf(v).forEach(l=>{ const i=l.indexOf("|"); if(i<0) return; const k=l.slice(0,i).trim(); const tools=l.slice(i+1).split(",").map(x=>x.trim()).filter(Boolean); if(k&&tools.length) o[k]=tools; }); return o; }
function parseQws(v){ let kind="qw"; const n={qw:0,gate:0,time:0}; const out=[];
  linesOf(v).forEach(l=>{ const m=l.match(/^##\s*(.+)$/); if(m){ const h=m[1].toLowerCase(); kind = /regla|candado|gate/.test(h)?"gate" : /tiempo|time|duraci/.test(h)?"time" : "qw"; return; }
    const parts=l.split("|").map(x=>x.trim()); const stage=parts.length>1?parts[0]:""; const text=parts.length>1?parts[1]:parts[0]; const help=parts.length>2?parts.slice(2).join(" | "):""; if(!text) return;
    n[kind]++; const it={id:RATING_KINDS[kind].id+"-"+String(n[kind]).padStart(2,"0"), kind, stage, text}; if(help) it.help=help; out.push(it); });
  return out; }

function stopAdmin(){ if(A.unsub) A.unsub(); if(A.poll) clearInterval(A.poll); clearTimeout(A._t); A.unsub=null; A.poll=null; }
function currentCode(){ return (new URLSearchParams(location.search).get("s")||"").trim().toUpperCase(); }

async function refetchAll(){
  const s=A.session;
  const [ns,ps,cs,vs,qr,ids,ivs] = await Promise.all([
    Store.getMySession(s.code), Store.listParticipants(s.id), Store.listCards(s.id), Store.listVotes(s.id),
    Store.listQwRatings(s.id), Store.listIdeas(s.id), Store.listIdeaVotes(s.id)
  ]);
  if(ns) A.session=ns; A.participants=ps; A.cards=cs; A.votes=vs; A.qwRatings=qr; A.ideas=ids; A.ideaVotes=ivs;
}

function startAdmin(s){
  stopAdmin();
  document.body.classList.add("admin-theme");
  A.session=s; A.participants=[]; A.cards=[]; A.votes=[]; A.qwRatings=[]; A.ideas=[]; A.ideaVotes=[]; A.seen=new Set();
  try{ history.replaceState(null,"",location.pathname+"?s="+encodeURIComponent(s.code)+"#admin"); }catch(e){}
  const kick=()=>{ clearTimeout(A._t); A._t=setTimeout(async()=>{ await refetchAll(); renderAdmin(); },350); };
  A.unsub=Store.subscribe(s.id, kick);
  A.poll=setInterval(kick, 8000);
  kick();
}

function participantURL(){
  const base=location.origin+location.pathname;
  return base+"?s="+A.session.code;
}

function renderAdmin(){
  const s=A.session, ph=s.phase||"lobby";
  const totals={}; A.votes.forEach(v=>totals[v.card_id]=(totals[v.card_id]||0)+(v.points||0));
  const votesUsed=A.votes.reduce((a,v)=>a+(v.points||0),0);
  const voters=new Set(A.votes.filter(v=>v.points>0).map(v=>v.participant_id)).size;
  const checkins=A.participants.filter(p=>p.mood).length;
  const qwRaters=new Set(A.qwRatings.map(r=>r.participant_id)).size;
  const ideasOnly=A.ideas.filter(i=>i.kind==="idea");
  const byId=Object.fromEntries(A.participants.map(p=>[p.id,p]));
  const phaseIdx=PHASES.findIndex(p=>p.id===ph);
  /* solo las tarjetas que acaban de llegar se animan (el panel se redibuja cada pocos segundos) */
  const fresh = id => A.seen.has(id) ? "" : " new";
  const who = pid => { const au=byId[pid]; return A.showAuthors&&au ? `<span class="who">${avatar(au.emoji,"xs")} ${esc(au.nombre)} · ${esc(au.rol||au.area||"")}</span>` : ""; };

  /* Cabecera y pie de cada tarjeta del panel (título, descripción, dato destacado) */
  const head=(t,d)=>`<div class="ph"><h2>${t}</h2>${d?`<p class="pdesc">${d}</p>`:""}</div>`;
  const foot=(main,sub,ic)=> main?`<div class="pf"><span class="pf-main">${icon(ic||"trendup")}<span>${main}</span></span>${sub?`<span class="pf-sub">${sub}</span>`:""}</div>`:"";
  const nP=A.participants.length;
  const TONE={green:"#1FA971",blue:"#278FD8",slate:"#7A879F",amber:"#F0962E",coral:"#E5484D",navy:"#173F84",sky:"#4FA9E6",deep:"#1B6FAE"};

  const panelParticipants = `
      <div class="panel">
        ${head("Participantes", nP? nP+" registrado"+(nP===1?"":"s")+" · entran escaneando el QR" : "Entran escaneando el QR desde su celular")}
        ${nP? `<div style="overflow-x:auto"><table class="ptable">
          <thead><tr><th></th><th>Nombre</th><th>Área</th><th>Rol</th><th>Etapas</th><th>Ánimo</th><th>Expectativa</th><th>Hora</th></tr></thead>
          <tbody>${A.participants.map(p=>{
            const m=MOODS.find(x=>x.v===p.mood);
            const et=(p.etapas||[]); const all=(s.stages||[]).length && et.length===(s.stages||[]).length;
            return `<tr><td>${avatar(p.emoji,"sm")}</td>
              <td style="font-weight:600">${esc(p.nombre)} ${esc(p.apellido||"")}</td>
              <td>${esc(p.area||"")}</td><td>${esc(p.rol||"")}</td>
              <td class="et">${all?"Todas":esc(et.map(shortStage).join(" · "))}</td>
              <td>${m? `<span class="who">${glass(m.ic,{size:"xs",tone:m.tone,tint:true})} ${m.t}</span>` : '<span class="hint">—</span>'}</td>
              <td>${esc(p.expectativa||"")}</td><td class="hint">${fmtTime(p.joined_at)}</td></tr>`;
          }).join("")}</tbody></table></div>`
        : emptyState("users","Aún no entra nadie","Proyecta el QR y espera a la colmena")}
      </div>`;

  /* Ánimo del equipo: dona con el total al centro */
  const moodN=MOODS.map(m=>({...m,n:A.participants.filter(p=>p.mood===m.v).length}));
  const topMood=[...moodN].sort((a,b)=>b.n-a.n)[0];
  const panelMood = checkins? `
      <div class="panel">
        ${head("Ánimo del equipo", `${checkins} de ${nP} respondieron el check-in`)}
        <div class="donut-wrap">
          ${donutSVG(moodN.map(m=>({t:m.t,v:m.n,color:TONE[m.tone]})),{center:checkins,sub:"check-ins"})}
          <div class="dleg">${moodN.map(m=>`<div class="dleg-row${m.n?"":" zero"}"><span class="sw" style="background:${TONE[m.tone]}"></span><span class="dl-t">${esc(m.t)}</span><b>${m.n}</b><span class="pct">${pctOf(m.n,checkins)}%</span></div>`).join("")}</div>
        </div>
        ${foot(`Predomina: ${esc(topMood.t)}`, `${pctOf(topMood.n,checkins)}% del equipo que hizo check-in`, topMood.ic)}
      </div>` : "";

  /* Dolores por etapa: columnas apiladas por intensidad */
  const stN=(s.stages||[]).map(st=>{ const cs=A.cards.filter(c=>c.etapa===st); return {st,n:cs.length,hi:cs.filter(c=>+c.severidad>=4).length}; });
  const stMax=Math.max(1,...stN.map(x=>x.n));
  const topSt=[...stN].sort((a,b)=>b.n-a.n||b.hi-a.hi)[0];
  const hiTotal=A.cards.filter(c=>+c.severidad>=4).length;
  const panelStages = A.cards.length? `
      <div class="panel">
        ${head("Dolores por etapa del proceso", `${A.cards.length} tarjetas · ${hiTotal} duelen mucho o son insoportables`)}
        <div class="leg"><span><i style="background:var(--c3)"></i>Duele mucho / insoportable (4–5)</span><span><i style="background:var(--c2)"></i>Molesta / incomoda / duele (1–3)</span></div>
        <div class="bars-v" style="--n:${stN.length}">${stN.map(x=>{ const lo=x.n-x.hi, pct=v=>(v/stMax*100).toFixed(1);
          return `<div class="bv" data-tip="${esc(x.st)}\n${x.n} tarjeta${x.n===1?"":"s"} · ${x.hi} de 4–5">
            <div class="bv-stack">${x.n?`<span class="bv-n" style="bottom:calc(${pct(x.n)}% + 6px)">${x.n}</span>`:""}${lo?`<i class="lo" style="height:${pct(lo)}%"></i>`:""}${x.hi?`<i class="hi" style="height:${pct(x.hi)}%"></i>`:""}</div>
            <span class="bv-x">${esc(stageX(x.st))}</span></div>`; }).join("")}</div>
        ${foot(`Donde más duele: ${esc(topSt.st)}`, `${topSt.n} tarjeta${topSt.n===1?"":"s"} · el número bajo cada columna es el paso del proceso`, "flame")}
      </div>` : "";

  /* Muro de dolores */
  const sorted = list => votesUsed ? [...list].sort((x,y)=>(totals[y.id]||0)-(totals[x.id]||0) || y.severidad-x.severidad) : list;
  const wcard = c => `<div class="wcard${fresh(c.id)}">
      <div class="wc-top">${sevPips(c.severidad)}<span class="wc-sev">${esc(SEV_LABELS[c.severidad]||"")}</span>
        ${totals[c.id]?`<span class="wc-votes" data-tip="${totals[c.id]} voto${totals[c.id]===1?"":"s"} en la votación">${hexIco()}${totals[c.id]}</span>`:""}</div>
      <div class="txt">${esc(c.texto)}</div>
      ${c.actividad||c.herramienta||A.showAuthors?`<div class="wc-foot">${c.actividad?`<span class="wc-tool act">${taskHTML(c.actividad)}</span>`:""}${c.herramienta?`<span class="wc-tool">${esc(c.herramienta)}</span>`:""}${who(c.participant_id)}</div>`:""}
    </div>`;
  const panelWall = `
      <div class="panel">
        ${head("Muro de dolores", A.cards.length? `${A.cards.length} tarjeta${A.cards.length===1?"":"s"}, agrupadas por etapa del proceso` : "Cada quien publica sus dolores por etapa del proceso")}
        ${A.cards.length? `<div class="wall">${
          orderStages(s,[...new Set(A.cards.map(c=>c.etapa))]).map(et=>{
            const cs=sorted(A.cards.filter(c=>c.etapa===et));
            return `<div class="wcol"><h3><span>${esc(et)}</span><b>${cs.length}</b></h3>${cs.map(wcard).join("")}</div>`;
          }).join("")}</div>`
        : emptyState("flame","Aún no hay tarjetas","Aparecerán aquí en vivo conforme el equipo las publique")}
      </div>`;

  const targets=topPains(A.cards, totals, s.idea_top||3);
  const vpp=s.votes_per_user||5, ipp=s.idea_votes||3;
  const smallV = voters<3;                                   /* pocos votantes: unidades, no barras al 100 % */
  const panelRank = `
      <div class="panel" id="sec-1">
        ${head("Ranking de dolores", votesUsed? `${votesUsed} votos de ${voters} persona${voters===1?"":"s"} · ${vpp} por persona` : `Cada quien reparte ${vpp} votos entre los dolores`)}
        ${votesUsed? renderRank(totals, targets, {voters, top:5}) : emptyState("target","Todavía no hay votos",(A.cards.length? "El ranking se arma en vivo conforme el equipo vota" : "Primero hacen falta tarjetas de dolor"))}
        ${votesUsed? (smallV? foot(`${votesUsed} voto${votesUsed===1?"":"s"} de ${voters} persona${voters===1?"":"s"}`, "El ranking se afina conforme vote el equipo; los retos se definen con 3 o más votantes", "target")
                     : foot(`Los ${targets.length} más votados se vuelven los retos de la fase de ideas`, `El resto queda en el muro y en el CSV`, "target")) : ""}
      </div>`;

  const qwT=qwCount(A.qwRatings);
  const allRated=(s.quickwins||[]).map(q=>({...q, kind:kindOf(q), st:qwStats(qwT[q.id], kindOf(q))}));
  const ratedIds=new Set(A.qwRatings.map(r=>r.qw_id));
  const listOf = k => allRated.filter(q=>q.kind===k);
  const hasData = k => listOf(k).some(q=>ratedIds.has(q.id));
  const ratersOf = k => { const ids=new Set(listOf(k).map(q=>q.id)); return new Set(A.qwRatings.filter(r=>ids.has(r.qw_id)).map(r=>r.participant_id)).size; };
  const qwList=listOf("qw"), gateList=listOf("gate"), timeList=listOf("time");
  const nQ=ratersOf("qw"), nG=ratersOf("gate"), nT=ratersOf("time");
  const byScore=[...qwList].sort((a,b)=>(b.st.idx??-1)-(a.st.idx??-1) || b.st.m-a.st.m);
  const best=byScore[0];
  const live = ph==="quickwins";
  const tieM = list => { const mx=Math.max(0,...list.map(q=>q.st.m)); return mx? list.filter(q=>q.st.m===mx) : []; };
  const qwFoot = () => { if(!hasData("qw")) return "";
    if(nQ<3){ const t=tieM(qwList); return foot(`${nQ} respuesta${nQ===1?"":"s"} · ${t.length} quick win${t.length===1?"":"s"} con «mucho»${t.length>1?" (empate)":""}`, "Con 3 o más personas aparece el índice 0–100", "bolt"); }
    const over=byScore.filter(q=>q.st.idx!==null&&q.st.idx>=70).length;
    return foot(`${over} quick win${over===1?"":"s"} pasa${over===1?"":"n"} de 70`, "Índice 0–100: mucho = 100 · algo = 50 · poco = 0 · «No aplica» no cuenta", "bolt"); };
  const panelQW = qwList.length ? `
      <div class="panel" id="sec-3">
        ${head("Quick wins que más ayudarían", hasData("qw")? `${nQ} de ${nP} persona${nQ===1?"":"s"} calificaron ${qwList.length} quick wins: mucho, algo o poco` : `${qwList.length} quick wins por etapa · el equipo los califica desde su celular`)}
        ${renderLikert(qwList, "qw", {raters:nQ, nP, top: live?0:5, k:"qw-all"})}
        ${qwFoot()}
      </div>` : "";
  const gByScore=[...gateList].sort((a,b)=>(b.st.idx??-1)-(a.st.idx??-1));
  const gTop=gByScore[0], gLow=[...gByScore].reverse().find(g=>g.st.idx!==null);
  const gUnder=gByScore.filter(g=>g.st.idx!==null&&g.st.idx<50).length;
  const gFoot = () => { if(!hasData("gate")) return "";
    if(nG<3){ const h=gateList.filter(q=>q.st.m).length, e=gateList.filter(q=>q.st.p).length, n=gateList.filter(q=>q.st.na).length;
      return foot(`${nG} respuesta${nG===1?"":"s"}: ${h} regla${h===1?"":"s"} ayuda${h===1?"":"n"}, ${e} estorba${e===1?"":"n"}, ${n} no le toca${n===1?"":"n"}`, "Con 3 o más personas aparece el índice de acuerdo", "check"); }
    return foot(`${gUnder? `${gUnder} regla${gUnder===1?"":"s"} por debajo de 50 merece${gUnder===1?"":"n"} conversación` : "Todas las reglas pasan de 50"}`, `Más acuerdo: ${esc(gTop.id)} (${gTop.st.idx}) · menos: ${esc(gLow.id)} (${gLow.st.idx}) · índice 0–100: ayuda = 100 · me da igual = 50 · estorba = 0`, "check"); };
  const panelGates = gateList.length ? `
      <div class="panel" id="sec-4">
        ${head("Reglas del nuevo flujo: acuerdo y fricción", hasData("gate")? `${gateList.length} reglas de LOCFY24 calificadas por quienes las van a vivir · a la derecha, ayuda; a la izquierda, estorba` : `${gateList.length} candados del nuevo flujo · el equipo dice si le ayudan o le estorban`)}
        ${renderDiverging(gateList, {raters:nG, nP, all: live, k:"gate-all"})}
        ${gFoot()}
      </div>` : "";
  const tSorted=[...timeList].sort((a,b)=>(b.st.idx??-1)-(a.st.idx??-1));
  const tLong=timeList.filter(q=>q.st.mode===3);
  const tTop=tSorted[0];
  const panelTimes = timeList.length ? `
      <div class="panel" id="sec-5">
        ${head("Cuánto tarda hoy cada etapa", hasData("time")? `Duración típica según el equipo, en el orden del proceso · base para los semáforos` : `${timeList.length} etapas · cada quien estima las suyas`)}
        ${renderStrip(timeList, {hasData:hasData("time")})}
        ${tTop&&tTop.st.idx!==null? (tLong.length? foot(`${tLong.length===1?"Una etapa tarda":tLong.length+" etapas tardan"} más de 2 semanas: ${tLong.map(q=>esc(q.stage||q.text)).join(" y ")}`, `Cada celda muestra lo más respondido · ${nT} persona${nT===1?"":"s"} estimaron`, "target")
                                   : foot(`La que más tarda: ${esc(tTop.stage||tTop.text)} · lo más común: ${esc(scaleLabel("time",tTop.st.mode))}`, `${nT} persona${nT===1?"":"s"} estimaron`, "target")) : ""}
      </div>` : "";
  const props=A.ideas.filter(i=>i.kind==="qw");
  const panelProps = `
      <div class="panel">
        ${head("Quick wins propuestos por el equipo", props.length? `${props.length} propuesta${props.length===1?"":"s"} nueva${props.length===1?"":"s"}${qwList.length?`, además de los ${qwList.length} de la lista`:""}` : "Mejoras rápidas que el equipo agrega desde su celular")}
        ${props.length? `<div class="wall props">${props.map(i=>`<div class="wcard${fresh(i.id)}"><div class="wc-top"><span class="wc-kind">${icon("bolt")}Propuesta</span></div><div class="txt">${esc(i.texto)}</div>
          <div class="wc-foot">${i.etapa?`<span class="wc-tool">${esc(i.etapa)}</span>`:""}${who(i.participant_id)}</div></div>`).join("")}</div>`
        : emptyState("bolt","Aún no hay propuestas","Aparecerán aquí en vivo")}
      </div>`;

  const iTot={}; A.ideaVotes.forEach(v=>iTot[v.idea_id]=(iTot[v.idea_id]||0)+1);
  const lead=ideasOnly.map(x=>({...x,v:iTot[x.id]||0})).sort((a,b)=>b.v-a.v)[0];
  const retoIdx = id => targets.findIndex(t=>t.id===id)+1;
  const retos = () => renderRetos(targets, ideasOnly, iTot, who, fresh);
  const panelIdeas = `
      <div class="panel" id="sec-2">
        ${head(`Ideas para los ${targets.length||s.idea_top||3} retos`, `${ideasOnly.length} idea${ideasOnly.length===1?"":"s"} · ${A.ideaVotes.length} apoyo${A.ideaVotes.length===1?"":"s"} · ${ipp} por persona`)}
        ${targets.length? retos() : emptyState("bulb","Primero hace falta la votación de dolores",`Los ${s.idea_top||3} más votados se vuelven los retos`)}
        ${lead&&lead.v? foot(`La idea con más apoyo: ${esc(lead.texto)}`, `${lead.v} apoyo${lead.v===1?"":"s"} · responde al reto ${retoIdx(lead.card_id)||"—"}`, "bulb") : ""}
      </div>`;

  /* ---------- Indicadores en vivo: seis tarjetas con la misma estructura ---------- */
  const kOn = k => k.includes(ph);
  const joins=A.participants.map(p=>+new Date(p.joined_at)).filter(Boolean);
  const recent=joins.filter(t=>Date.now()-t<5*60000).length;
  const sevAvg=A.cards.length? (A.cards.reduce((a,c)=>a+(+c.severidad||0),0)/A.cards.length).toFixed(1).replace(".0","") : null;
  const stWith=stN.filter(x=>x.n).length;
  const votesMax=nP*vpp, supMax=nP*ipp;
  const kpis = `<div class="kpis">
    ${kpiTile({on:kOn(["lobby"]), icon:"users", label:"Participantes", value:nP,
      main: nP? (recent? `${recent} entraron en los últimos 5 min` : "Todos dentro, nadie nuevo en 5 min") : "Aún no entra nadie",
      sub: nP? "Con nombre, área, rol y etapas" : "Proyecta el QR para que entren"})}
    ${kpiTile({on:kOn(["checkin"]), icon:"cloudsun", label:"Check-in", value:checkins, of:nP,
      main: checkins? `Predomina: ${esc(topMood.t)}` : "Aún sin respuestas",
      sub: checkins? (checkins>=5? `${pctOf(checkins,nP)}% del equipo respondió` : `${checkins} de ${nP} respondieron`) : "Ánimo y expectativa de cada quien"})}
    ${kpiTile({on:kOn(["pains"]), icon:"flame", label:"Dolores", value:A.cards.length,
      main: A.cards.length? `Más en ${esc(stageTag(topSt.st))}` : "Aún sin tarjetas",
      sub: A.cards.length? `Dolor promedio ${sevAvg}/5 · ${stWith} de ${stN.length} etapas` : "Tarjetas por etapa del proceso"})}
    ${kpiTile({on:kOn(["votes"]), icon:"target", label:"Votación", value:votesUsed, of:votesMax,
      main: votesUsed? `${voters} de ${nP} personas votaron` : "Aún sin votos",
      sub: `${vpp} votos por persona`})}
    ${kpiTile({on:kOn(["quickwins"]), icon:"bolt", label:"Validación", value:qwRaters, of:nP,
      main: A.qwRatings.length? `${A.qwRatings.length} calificaciones` : "Aún sin calificaciones",
      sub: `${qwList.length} quick wins${gateList.length?` · ${gateList.length} reglas`:""}${timeList.length?` · ${timeList.length} tiempos`:""} · ${props.length} propuesta${props.length===1?"":"s"}`})}
    ${kpiTile({on:kOn(["ideas"]), icon:"bulb", label:"Ideas", value:ideasOnly.length,
      main: A.ideaVotes.length? `${A.ideaVotes.length} de ${supMax} apoyos usados` : (ideasOnly.length? "Aún sin apoyos" : "Aún sin ideas"),
      sub: `${ipp} apoyos por persona · ${targets.length||s.idea_top||3} retos`})}
  </div>`;

  /* «X de N listos»: quiénes ya dieron por terminada la actividad en curso (desde su celular) */
  const ACT_T={checkin:"Check-in",pains:"Dolores",votes:"Votación",quickwins:"Validación",ideas:"Ideas"};
  const listos=ACT_T[ph]? A.participants.filter(p=>(p.done_phases||[]).includes(ph)).length : null;
  const ready = ACT_T[ph] ? `<div class="ready${nP&&listos===nP?" all":""}" data-tip="Cada quien marca «terminé» en su celular. Cuando la mayoría esté lista, abre la siguiente actividad.">
      <span class="ready-t"><b>${listos}</b> de ${nP} listos con ${ACT_T[ph]}</span><i class="ready-bar"><span style="width:${pctOf(listos,nP)}%"></span></i>${nP&&listos===nP?`<span class="ready-ok">Todos listos: abre la siguiente</span>`:""}</div>` : "";

  /* ---------- Resultados / Cierre: titular + cinco secciones numeradas + contexto plegado ---------- */
  const isResults = ph==="results"||ph==="closed";
  const top1 = votesUsed? topPains(A.cards, totals, 1)[0] : null;
  const tile = (label, v, sub, href) => v? `<a class="tile" href="${href}" data-go="${href}"><span class="tile-l">${label}</span><span class="tile-v">${v}</span><span class="tile-s">${sub||""}</span></a>`
                                        : `<div class="tile nodata"><span class="tile-l">${label}</span><span class="tile-v">Sin datos aún</span></div>`;
  const tQW = () => { if(!hasData("qw")) return tile("Quick win con más apoyo");
    if(nQ<3){ const t=tieM(qwList); return t.length===1? tile("Quick win con más apoyo", esc(t[0].text), `${nQ} persona${nQ===1?"":"s"}: mucho`, "#sec-3") : tile("Quick win con más apoyo", `${t.length} empatados con «mucho»`, `${nQ} respuesta${nQ===1?"":"s"} · se define con más gente`, "#sec-3"); }
    return tile("Quick win con más apoyo", esc(best.text), `Índice ${best.st.idx} · ${best.st.n} respuesta${best.st.n===1?"":"s"}`, "#sec-3"); };
  const tRG = () => { if(!hasData("gate")||!gLow) return tile("Regla con menos acuerdo");
    if(nG<3){ const e=gateList.filter(q=>q.st.p); return e.length? tile("Regla con menos acuerdo", esc(e[0].text), `${nG} persona${nG===1?"":"s"}: estorba${e.length>1?` · y ${e.length-1} más`:""}`, "#sec-4") : tile("Regla con menos acuerdo", "Ninguna estorba por ahora", `${nG} respuesta${nG===1?"":"s"}`, "#sec-4"); }
    return tile("Regla con menos acuerdo", esc(gLow.text), `Índice ${gLow.st.idx} · ${gLow.st.n} respuesta${gLow.st.n===1?"":"s"}${gLow.st.idx<50?" · hay que conversarla":""}`, "#sec-4"); };
  const tTM = () => { if(!hasData("time")||!tTop||tTop.st.mode===null) return tile("Etapa que más tarda");
    const cnt=[tTop.st.na,tTop.st.p,tTop.st.a,tTop.st.m][tTop.st.mode];
    return tile("Etapa que más tarda", esc(tTop.stage||tTop.text), tTop.st.n<3? `${tTop.st.n} persona${tTop.st.n===1?"":"s"}: ${esc(scaleLabel("time",tTop.st.mode).toLowerCase())}` : `${esc(scaleLabel("time",tTop.st.mode))} para ${cnt} de ${tTop.st.n}`, "#sec-5"); };
  const tID = () => lead&&lead.v? tile("Idea con más apoyo", esc(lead.texto), `${lead.v} apoyo${lead.v===1?"":"s"} · responde al reto ${retoIdx(lead.card_id)||"—"}`, "#sec-2") : tile("Idea con más apoyo");
  const ctxLine = `${ph==="closed"?"Taller cerrado":"Resultados"} · ${nP} persona${nP===1?"":"s"} · ${A.cards.length} dolor${A.cards.length===1?"":"es"} · ${votesUsed} voto${votesUsed===1?"":"s"} · ${A.qwRatings.length} calificacion${A.qwRatings.length===1?"":"es"} · ${ideasOnly.length} idea${ideasOnly.length===1?"":"s"}`;
  const hero = `<section class="hero">
      <p class="hero-ctx">${ctxLine}</p>
      ${top1? `<p class="hero-l">El dolor más votado${smallV?` · ${voters} votante${voters===1?"":"s"}, se afina con más gente`:""}</p><h1 class="hero-t">${esc(top1.texto)}</h1>
               <p class="hero-s">${top1.pts} de ${votesUsed} voto${votesUsed===1?"":"s"} · ${esc(top1.etapa)}${top1.actividad?` · ${taskHTML(top1.actividad)}`:""} · ${esc((SEV_LABELS[top1.severidad]||"").toLowerCase())} (${top1.severidad}/5)</p>`
             : `<p class="hero-l">El dolor más votado</p><h1 class="hero-t muted">Sin votos todavía</h1><p class="hero-s">${A.cards.length? `${A.cards.length} tarjeta${A.cards.length===1?"":"s"} en el muro, sin votación` : "No hubo tarjetas ni votos"}</p>`}
      <div class="tiles">${tQW()}${tRG()}${tTM()}${tID()}</div>
    </section>`;
  const secHead=(n,t,d)=>`<div class="ph sec"><span class="sec-n">${n}</span><div><h2>${t}</h2>${d?`<p class="pdesc">${d}</p>`:""}</div></div>`;
  const wrapSec=(n,html,t,d)=>html.replace(/<div class="ph">[\s\S]*?<\/div>\s*(?=<)/, secHead(n,t,d));
  const retoVotes=targets.reduce((a,t)=>a+t.pts,0);
  const resRank = `<div class="panel" id="sec-1">
        ${secHead(1,"Dolores que más pesan", votesUsed? (smallV? `${votesUsed} voto${votesUsed===1?"":"s"} de ${voters} persona${voters===1?"":"s"} · ${vpp} por persona` : `Los ${targets.length} más votados fueron los retos de la fase de ideas · ${votesUsed} votos de ${voters} personas, ${vpp} por persona`) : "No hubo votación")}
        ${votesUsed? renderRank(totals, targets, {voters, top:5}) : emptyState("target","Sin votos","No se registraron votos en este taller")}
        ${votesUsed? (smallV? foot(`${votesUsed} voto${votesUsed===1?"":"s"} de ${voters} persona${voters===1?"":"s"}`, "El ranking se afina conforme vote el equipo", "target")
                     : foot(`Los ${targets.length} retos concentran ${retoVotes} de ${votesUsed} votos (${pctOf(retoVotes,votesUsed)} %)`, "", "target")) : ""}
      </div>`;
  const resIdeas = wrapSec(2, panelIdeas, "Ideas para los "+(targets.length||s.idea_top||3)+" retos", `${ideasOnly.length} idea${ideasOnly.length===1?"":"s"} · ${A.ideaVotes.length} apoyo${A.ideaVotes.length===1?"":"s"} · ${ipp} por persona`);
  const resQW = qwList.length? wrapSec(3, panelQW, "Quick wins que más ayudarían", hasData("qw")? `${nQ} persona${nQ===1?"":"s"} calificaron ${qwList.length} quick wins: mucho, algo o poco` : "Nadie calificó los quick wins") : "";
  const resGates = gateList.length? wrapSec(4, panelGates, "Reglas del nuevo flujo: acuerdo y fricción", hasData("gate")? `${gateList.length} reglas de LOCFY24 calificadas por quienes las van a vivir` : "Nadie calificó las reglas") : "";
  const resTimes = timeList.length? wrapSec(5, panelTimes, "Cuánto tarda hoy cada etapa", hasData("time")? "Duración típica según el equipo, en el orden del proceso · base para los semáforos" : "Nadie estimó los tiempos") : "";
  const ctxMood = checkins? `<div class="panel">${head("Ánimo al empezar", `${checkins} de ${nP} hicieron check-in`)}
        ${checkins===1? `<p class="ctx-line">${glass(topMood.ic,{size:"sm",tone:topMood.tone,tint:true})} 1 check-in: <b>${esc(topMood.t)}</b></p>`
         : `<div class="donut-wrap">${donutSVG(moodN.map(m=>({t:m.t,v:m.n,color:TONE[m.tone]})),{center:checkins,sub:"check-ins"})}
            <div class="dleg">${moodN.map(m=>`<div class="dleg-row${m.n?"":" zero"}"><span class="sw" style="background:${TONE[m.tone]}"></span><span class="dl-t">${esc(m.t)}</span><b>${m.n}</b><span class="pct">${checkins>=5?pctOf(m.n,checkins)+"%":""}</span></div>`).join("")}</div></div>
            ${foot(`Predomina: ${esc(topMood.t)} (${topMood.n})`, `${moodN.filter(m=>["saturado","rebasado"].includes(m.v)).reduce((a,m)=>a+m.n,0)} llegaron saturados o rebasados`, topMood.ic)}`}
      </div>` : "";
  const resultsView = `${hero}
      ${resRank}
      ${resIdeas}
      ${resQW||resGates? `<div class="duo2">${resQW}${resGates}</div>` : ""}
      ${resTimes}
      <details class="ctx" data-k="ctx"><summary><span class="ctx-t">Contexto del taller</span><span class="ctx-s">ánimo, dolores por etapa, propuestas y muro</span></summary>
        <div class="ctx-body">${ctxMood||panelStages? `<div class="duo">${ctxMood}${panelStages}</div>` : ""}${panelProps}${panelWall}</div>
      </details>`;

  let panels="";
  if(ph==="lobby"||ph==="checkin") panels= panelMood ? `<div class="duo">${panelMood}${panelParticipants}</div>` : panelParticipants;
  else if(ph==="pains") panels=panelStages+panelWall;
  else if(ph==="votes") panels=panelRank+panelStages+panelWall;
  else if(ph==="quickwins") panels=panelQW+panelGates+panelTimes+panelProps+panelRank;
  else if(ph==="ideas") panels=panelIdeas;
  else panels=resultsView;
  document.body.classList.toggle("project", !!(A.project && isResults));

  $("#app").innerHTML = `<div class="a-shell">
    <div class="a-top">
      <span class="brand">${brandLockup("xs")} <span>${esc(s.brand||CONFIG.BRAND)} <span class="brand-by">· ${BRAND_ORG}</span></span></span>
      <div class="a-head"><span class="a-title" title="${esc(s.name)}">${esc(s.name)}</span><span class="a-code" title="Código de la sesión">${esc(s.code)}</span></div>
      <div class="a-actions">
        <button class="abtn" id="btnAuthors">${A.showAuthors?"Ocultar autores":"Mostrar autores"}</button>
        <button class="abtn" id="btnCSV">Exportar CSV</button>
        <button class="abtn primary" id="btnQR">QR para entrar</button>
        <button class="abtn" id="btnBack">Tus talleres</button>
        <button class="abtn danger" id="btnDel">Borrar taller</button>
      </div>
    </div>
    <div class="phasebar" role="tablist" aria-label="Fase de la sesión">
      ${PHASES.map((p,i)=>`<button class="phase ${p.id===ph?"on":i<phaseIdx?"done":""}" data-ph="${p.id}">${i+1}. ${p.t}</button>`).join("")}
      ${ready}${isResults?`<div class="ready"><button class="abtn${A.project?" on":""}" id="btnProject" data-tip="Letra ×1,25, sin metadatos ni contexto: para la pantalla de la sala">${A.project?"Salir de proyección":"Proyectar"}</button></div>`:""}
    </div>
    <div class="a-main${isResults?" results":""}">
      ${isResults?"":kpis}
      ${panels}
    </div>
  </div>`;

  installTips();
  A.cards.forEach(c=>A.seen.add(c.id)); A.ideas.forEach(i=>A.seen.add(i.id));
  $$(".phase").forEach(b=>b.onclick=async()=>{
    const ph=b.dataset.ph;
    if(ph==="closed" && !confirm("¿Cerrar la sesión para todos?")) return;
    try{ await Store.updateSession(s.id,{phase:ph}); A.session.phase=ph; await refetchAll(); renderAdmin(); }
    catch(e){ console.error(e); toast("No se pudo cambiar la fase: "+friendlyAuthError(e)); }
  });
  $("#btnBack").onclick=()=>{ stopAdmin(); history.replaceState(null,"",location.pathname+"#admin"); adminBoot(); };
  $("#btnDel").onclick=async()=>{
    if(!confirm("¿Borrar este taller y TODO lo capturado (participantes, tarjetas, votos, quick wins e ideas)? Exporta el CSV antes si lo necesitas. No se puede deshacer.")) return;
    try{ await Store.deleteSession(s.id); stopAdmin(); toast("Taller borrado"); history.replaceState(null,"",location.pathname+"#admin"); adminBoot(); }
    catch(e){ toast("No se pudo borrar: "+friendlyAuthError(e)); }
  };
  $("#btnAuthors").onclick=()=>{ A.showAuthors=!A.showAuthors; renderAdmin(); };
  const bp=$("#btnProject"); if(bp) bp.onclick=()=>{ A.project=!A.project; renderAdmin(); };
  /* «Ver todos» y «Contexto» recuerdan si estaban abiertos (el panel se redibuja cada pocos segundos) */
  $$("details[data-k]").forEach(d=>{ d.open=A.open.has(d.dataset.k); d.addEventListener("toggle",()=>{ if(d.open) A.open.add(d.dataset.k); else A.open.delete(d.dataset.k); }); });
  $$("[data-go]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const t=$(a.dataset.go); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); });
  $("#btnQR").onclick=showQR;
  $("#btnCSV").onclick=exportAll;
}

/* Etapas del muro en el orden del proceso (las no configuradas van al final) */
function orderStages(s, list){
  const order=(s.stages||[]);
  return [...list].sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); });
}

/* ---------- Piezas de visualización (SVG y HTML propios, sin librerías) ---------- */
const pctOf=(a,b)=> b ? Math.max(0,Math.min(100,Math.round(a/b*100))) : 0;
function sevPips(n){ n=+n||0; return `<span class="pips" role="img" aria-label="Dolor ${n} de 5">${[1,2,3,4,5].map(i=>`<i${i<=n?' class="on"':""}></i>`).join("")}</span>`; }
function hexIco(){ return '<i class="hx" aria-hidden="true"></i>'; }
/* «3 Revisar información» → «Etapa 3»; «Transversal (…)» → «Transversal» */
function stageTag(t){ const n=shortStage(t); return /^\d+$/.test(n) ? "Etapa "+n : String(t||"").split(/[ (/]/)[0]; }
/* Etiqueta de eje: el número del paso, o la primera palabra */
function stageX(t){ const n=shortStage(t); return /^\d+$/.test(n) ? n : String(t||"").split(/[ (/]/)[0]; }

/* Dona con el total al centro; cada gajo lleva su tooltip */
function donutSVG(parts,o){ o=o||{}; const size=170, st=26, total=parts.reduce((a,p)=>a+p.v,0)||1, r=(size-st)/2, c=2*Math.PI*r; let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{ const len=c*p.v/total, gap=parts.filter(x=>x.v>0).length>1?3:0;
    const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${st}" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" data-tip="${esc(p.t)} · ${p.v} (${pctOf(p.v,total)}%)"/>`; off+=len; return el; }).join("");
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(parts.map(p=>p.t+" "+p.v).join(", "))}"><g transform="rotate(-90 ${size/2} ${size/2})">${segs}</g>
    <text x="50%" y="48%" text-anchor="middle" class="donut-n">${o.center??""}</text><text x="50%" y="48%" dy="1.7em" text-anchor="middle" class="donut-s">${o.sub||""}</text></svg>`; }

function kpiTile(o){
  return `<div class="kpi${o.on?" on":""}">
    <div class="kpi-h"><span class="kpi-l">${o.label}</span><span class="ico-line">${icon(o.icon)}</span>${o.on?'<span class="kpi-live"><i></i>En curso</span>':""}</div>
    <div class="kpi-v"><span class="n">${o.value}</span>${o.of!=null?`<span class="of">de ${o.of}</span>`:""}</div>
    <div class="kpi-f"><span class="kpi-f1">${o.main||""}</span><span class="kpi-f2">${o.sub||""}</span></div>
  </div>`;
}
/* Estado vacío, igual en todas las tarjetas */
function emptyState(ic,title,hint){ return `<div class="empty-st">${glass(ic,{size:"md",tone:"slate"})}<b>${title}</b>${hint?`<span>${hint}</span>`:""}</div>`; }
/* Tooltip único para todo lo que tenga data-tip (texto plano, nunca HTML) */
function installTips(){
  if(window.__tips) return; window.__tips=true;
  const tip=document.createElement("div"); tip.className="vtip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
  const place=(x,y)=>{ const r=tip.getBoundingClientRect(); let L=x+14, T=y+16;
    if(L+r.width>innerWidth-8) L=x-r.width-14; if(T+r.height>innerHeight-8) T=y-r.height-16;
    tip.style.left=Math.max(8,L)+"px"; tip.style.top=Math.max(8,T)+"px"; };
  const find=t=>t&&t.closest?t.closest("[data-tip]"):null;
  document.addEventListener("pointermove",e=>{ const el=find(e.target); if(!el){ tip.classList.remove("on"); return; } tip.textContent=el.dataset.tip||el.getAttribute("data-tip"); tip.classList.add("on"); place(e.clientX,e.clientY); });
  document.addEventListener("focusin",e=>{ const el=find(e.target); if(!el) return; tip.textContent=el.getAttribute("data-tip"); tip.classList.add("on"); const r=el.getBoundingClientRect(); place(r.left+r.width/2,r.bottom); });
  ["focusout","scroll","pointerleave"].forEach(ev=>document.addEventListener(ev,()=>tip.classList.remove("on"),true));
}

/* Unidades de la colmena: un hexágono por voto o apoyo (se lee a 3 m sin eje) */
function hexUnits(on, total, cls){ return `<span class="hxu ${cls||""}">${'<i class="on"></i>'.repeat(on)}${'<i></i>'.repeat(Math.max(0,total-on))}</span>`; }
const durShort = v => ["< 1 día","1–5 d","1–2 sem","> 2 sem"][v] || "—";

/* 1 · Ranking de dolores: barras horizontales gruesas con la etiqueta encima; top 5 y «ver todos».
   Con menos de 3 votantes se muestran unidades (un hexágono por voto), sin retos. */
function renderRank(totals, targets, o){
  o=o||{}; const small=(o.voters||0)<3;
  const all=[...A.cards].map(c=>({c,pts:totals[c.id]||0})).filter(r=>r.pts>0).sort((a,b)=>b.pts-a.pts || b.c.severidad-a.c.severidad);
  const max=Math.max(...all.map(r=>r.pts),1);
  const retoOf=id=>{ if(small) return 0; const i=(targets||[]).findIndex(t=>t.id===id); return i<0?0:i+1; };
  const row=({c,pts},i)=>{ const r=retoOf(c.id);
    return `<div class="rk-row${r?" top":""}">
      <div class="rk-h"><span class="rk-pos" aria-label="Lugar ${i+1}">${i+1}</span><span class="rk-txt">${esc(c.texto)}</span>${r?`<span class="hb-reto">Reto ${r}</span>`:""}</div>
      <div class="rk-meta">${esc(c.etapa)}${c.actividad?` · ${taskHTML(c.actividad)}`:""} · dolor ${c.severidad}/5</div>
      ${small? `<div class="rk-units">${hexUnits(pts,pts)}<b>${pts} voto${pts===1?"":"s"}</b></div>`
             : `<div class="rk-bar" data-tip="${pts} voto${pts===1?"":"s"} · ${esc(c.etapa)}"><i style="width:${Math.max(3,pts/max*100).toFixed(1)}%"></i><b>${pts}</b></div>`}
    </div>`; };
  const top=o.top||5, shown=all.slice(0,top), rest=all.slice(top);
  return `<div class="rk">${shown.map(row).join("")}</div>
    ${rest.length?`<details class="more-a" data-k="${o.k||"rank-all"}"><summary>Ver las ${all.length} tarjetas con votos</summary><div class="rk">${rest.map((r,i)=>row(r,i+top)).join("")}</div></details>`:""}`;
}

/* 3 · Quick wins: filas Likert (barra apilada horizontal al 100 %: mucho · algo · poco) con el índice grande.
   Con menos de 3 calificadores: unidades por fila, sin índice; orden por etapa. */
function renderLikert(list, kind, o){
  o=o||{}; const K=RATING_KINDS[kind], L=v=>K.scale.find(x=>x.v===v).t, small=(o.raters||0)<3, hasData=list.some(q=>q.st.n);
  if(!hasData) return emptyState("bolt","Aún no hay calificaciones","La gráfica aparecerá en vivo conforme el equipo responda");
  const seg=(cls,n)=> n?`<i class="${cls}" style="flex:${n}">${n>=2?n:""}</i>`:"";
  const row=q=>{ const st=q.st, b=st.m+st.a+st.p;
    const t=`<div class="lk-t"><span class="lk-id">${esc(q.id)}</span>${esc(q.text)}${!small&&o.nP&&st.n<o.nP/2?'<span class="lk-few">pocas respuestas</span>':""}</div>`;
    if(small){ const u = st.m? `${hexUnits(st.m,st.m,"m")} ${st.m>1?st.m+" personas":"1 persona"}: ${L(3).toLowerCase()}` : st.a? `${hexUnits(st.a,st.a,"a")} ${st.a>1?st.a+" personas":"1 persona"}: ${L(2).toLowerCase()}` : st.p? `${hexUnits(st.p,st.p,"p")} ${st.p>1?st.p+" personas":"1 persona"}: ${L(1).toLowerCase()}` : st.na? `<span class="lk-na">${L(0)}</span>` : `<span class="lk-na">sin respuesta</span>`;
      return `<div class="lk-row small">${t}<div class="lk-u">${u}</div></div>`; }
    return `<div class="lk-row">${t}
      <div class="lk-bar" data-tip="${esc(q.text)}\n${L(3)} ${st.m} · ${L(2)} ${st.a} · ${L(1)} ${st.p}${st.na?` · ${L(0)} ${st.na}`:""}">${b?seg("m",st.m)+seg("a",st.a)+seg("p",st.p):'<i class="none"></i>'}</div>
      <div class="lk-idx${st.n?"":" zero"}">${st.idx===null?"—":st.idx}<small>${st.n?st.n+" resp.":"sin resp."}</small></div></div>`; };
  const byStage=l=>{ const g=[]; l.forEach(q=>{ let x=g.find(y=>y.stage===q.stage); if(!x){ x={stage:q.stage,items:[]}; g.push(x); } x.items.push(q); }); return g.map(x=>`<div class="qwl-stage">${esc(x.stage||"Sin etapa")}</div>${x.items.map(row).join("")}`).join(""); };
  const byScore=[...list].sort((a,b)=>(b.st.idx??-1)-(a.st.idx??-1) || b.st.m-a.st.m);
  const legend = small? "" : `<div class="leg"><span><i class="m"></i>${L(3)}</span><span><i class="a"></i>${L(2)}</span><span><i class="p"></i>${L(1)}</span></div>`;
  if(small || !o.top) return legend+`<div class="lk">${byStage(list)}</div>`;
  const shown=byScore.slice(0,o.top);
  return legend+`<div class="lk">${shown.map(row).join("")}</div>
    ${list.length>o.top?`<details class="more-a" data-k="${o.k||"lk-all"}"><summary>Ver los ${list.length}, por etapa</summary><div class="lk">${byStage(list)}</div></details>`:""}`;
}

/* 4 · Reglas: barras divergentes centradas en «me da igual» (derecha ayuda, izquierda estorba).
   Se muestran las 3 con más acuerdo y las 3 con menos; el resto plegado. */
function renderDiverging(list, o){
  o=o||{}; const K=RATING_KINDS.gate, L=v=>K.scale.find(x=>x.v===v).t, small=(o.raters||0)<3, hasData=list.some(q=>q.st.n);
  if(!hasData) return emptyState("check","Aún no hay calificaciones","La gráfica aparecerá en vivo conforme el equipo responda");
  const row=q=>{ const st=q.st, b=st.m+st.a+st.p;
    const t=`<div class="lk-t"><span class="lk-id">${esc(q.id)}</span>${esc(q.text)}</div>`;
    if(small) return `<div class="dv-row small">${t}<div class="dv-u"><span class="l">${st.p?hexUnits(st.p,st.p,"p")+" estorba":""}</span><span class="c"></span><span class="r">${st.m?hexUnits(st.m,st.m,"m")+" ayuda":""}</span>${st.a?`<span class="dv-mid">${st.a} me da igual</span>`:""}${!b&&st.na?`<span class="lk-na">${L(0)}</span>`:""}</div></div>`;
    const pr=b?st.m/b*100:0, pl=b?st.p/b*100:0;
    return `<div class="dv-row">${t}
      <div class="dv-bar" data-tip="${esc(q.text)}\n${L(3)} ${st.m} · ${L(2)} ${st.a} · ${L(1)} ${st.p}${st.na?` · ${L(0)} ${st.na}`:""}">
        <span class="l"><i style="width:${pl.toFixed(1)}%">${st.p>=2?st.p:""}</i></span><span class="c">${st.a?`<em>${st.a}</em>`:""}</span><span class="r"><i style="width:${pr.toFixed(1)}%">${st.m>=2?st.m:""}</i></span></div>
      <div class="lk-idx${st.n?"":" zero"}">${st.idx===null?"—":st.idx}<small>${st.n?st.n+" resp.":"sin resp."}</small></div></div>`; };
  const legend = small? "" : `<div class="leg dv-leg"><span><i class="p"></i>${L(1)}</span><span><i class="mid"></i>${L(2)}</span><span><i class="m"></i>${L(3)}</span></div>`;
  const byScore=[...list].sort((a,b)=>(b.st.idx??-1)-(a.st.idx??-1));
  if(small || o.all || list.length<=6) return legend+`<div class="dv">${(small?list:byScore).map(row).join("")}</div>`;
  const rated=byScore.filter(q=>q.st.idx!==null), top=rated.slice(0,3), low=rated.slice(-3).filter(q=>!top.includes(q));
  const shownIds=new Set([...top,...low].map(q=>q.id)), rest=byScore.filter(q=>!shownIds.has(q.id));
  return legend+`<div class="dv"><div class="dv-h">Más acuerdo</div>${top.map(row).join("")}${low.length?`<div class="dv-h low">Menos acuerdo · hay que conversarlas</div>${low.map(row).join("")}`:""}</div>
    ${rest.length?`<details class="more-a" data-k="${o.k||"dv-all"}"><summary>Ver las ${list.length}</summary><div class="dv">${rest.map(row).join("")}</div></details>`:""}`;
}

/* 5 · Tiempos: tira de proceso, una celda por etapa en orden, del tono de su duración típica */
function renderStrip(list, o){
  o=o||{}; const K=RATING_KINDS.time, L=v=>K.scale.find(x=>x.v===v).t;
  if(!o.hasData) return emptyState("target","Aún no hay estimaciones","Cada quien estima las etapas en las que participa");
  const cell=q=>{ const st=q.st, n=st.n, counts=[st.na,st.p,st.a,st.m], name=String(q.stage||q.text||"");
    const num=stageX(name), title=name.replace(/^\d+\s+/,"");
    if(!n) return `<div class="sc none" data-tip="${esc(name)}\nsin respuestas"><span class="sc-n">${esc(num)}</span><span class="sc-t">${esc(title)}</span><b class="sc-d">—</b><small>sin resp.</small></div>`;
    const mode=st.mode, share=counts[mode]/n, dis=share<.5;
    const tip=`${esc(name)}\n${L(0)} ${st.na} · ${L(1)} ${st.p} · ${L(2)} ${st.a} · ${L(3)} ${st.m}`;
    if(n<3) return `<div class="sc t${mode}" data-tip="${tip}"><span class="sc-n">${esc(num)}</span><span class="sc-t">${esc(title)}</span><b class="sc-d">${durShort(mode)}</b><small>${n} persona${n===1?"":"s"}${n>1&&dis?" · dividido":""}</small></div>`;
    return `<div class="sc t${mode}${dis?" dis":""}" data-tip="${tip}"><span class="sc-n">${esc(num)}</span><span class="sc-t">${esc(title)}</span><b class="sc-d">${durShort(mode)}</b><small>${n} resp.${dis?" · dividido":""}</small></div>`; };
  return `<div class="leg"><span><i class="t0"></i>${L(0)}</span><span><i class="t1"></i>${L(1)}</span><span><i class="t2"></i>${L(2)}</span><span><i class="t3"></i>${L(3)}</span></div>
    <div class="strip" style="--n:${list.length}">${list.map(cell).join("")}</div>`;
}

/* 2 · Retos e ideas: un hexágono por apoyo (misma escala dentro del reto); la idea líder resaltada */
function renderRetos(targets, ideasOnly, iTot, who, fresh){
  const anySupport=ideasOnly.some(x=>iTot[x.id]);
  return `<div class="retos">${targets.map((c,i)=>{
    const list=ideasOnly.filter(x=>x.card_id===c.id).map(x=>({...x,v:iTot[x.id]||0}))
      .sort((a,b)=>b.v-a.v || String(a.created_at).localeCompare(String(b.created_at)));
    const max=Math.max(1,...list.map(x=>x.v));
    const lead=list.length&&list[0].v>0 ? list[0].id : null;
    return `<section class="reto">
      <div class="reto-h"><span class="reto-k">Reto ${i+1}</span><span class="reto-m" title="${esc(c.etapa)}">${esc(stageTag(c.etapa))} · ${c.pts} voto${c.pts===1?"":"s"}</span></div>
      <h3 class="reto-t">${esc(c.texto)}</h3>
      <ul class="ideas">${list.map(x=>`<li class="idea${x.id===lead?" lead":""}${fresh(x.id)}">
          <div class="idea-t">${esc(x.texto)}${who(x.participant_id)}</div>
          ${anySupport? (x.v>20? `<div class="idea-b" data-tip="${x.v} apoyos"><span class="idea-rail"><i style="width:${(x.v/max*100).toFixed(1)}%"></i></span><b>${x.v}</b></div>`
                                : `<div class="idea-u" data-tip="${x.v} apoyo${x.v===1?"":"s"}">${hexUnits(x.v,max)}<b>${x.v}</b></div>`) : ""}
        </li>`).join("")||'<li class="idea empty-idea">Aún sin ideas</li>'}</ul>
      ${list.length&&!anySupport?'<p class="idea-none">Aún sin apoyos</p>':""}
    </section>`; }).join("")}</div>`;
}

function showQR(){
  const url=participantURL();
  $("#qrModal").innerHTML = `<div class="qr-modal" id="qrBack">
    <div class="qr-box">
      <div style="margin:0 auto 12px">${brandLockup("sm")}</div>
      <h2>Entra desde tu celular</h2>
      <p style="font-size:14px;color:#5A5670">Escanea el QR o entra a la liga y escribe el código</p>
      <div class="code">${esc(A.session.code)}</div>
      <div id="qrTarget"></div>
      <p class="qr-link">${esc(url)}</p>
      <button class="abtn primary" id="qrCopy" style="width:100%">Copiar liga</button>
      <button class="abtn" id="qrClose" style="width:100%;margin-top:8px;background:#fff;border-color:#DCE3EE;color:#01133B">Cerrar</button>
      <div class="qk-by" style="margin-top:16px">Una plataforma de<img class="qk-logo" style="height:38px" src="${BRAND_IMG.qk}" alt="${BRAND_ORG}"></div>
    </div></div>`;
  try{
    const q=qrcode(0,'M'); q.addData(url); q.make();
    $("#qrTarget").innerHTML=q.createSvgTag({cellSize:5, margin:3});
    const svg=$("#qrTarget svg"); if(svg){ svg.setAttribute("width","220"); svg.setAttribute("height","220"); svg.setAttribute("role","img"); svg.setAttribute("aria-label","QR para entrar a la sesión"); svg.style.borderRadius="12px"; }
  }catch(e){ $("#qrTarget").innerHTML='<p class="hint">No se pudo generar el QR aquí; comparte la liga.</p>'; }
  $("#qrClose").onclick=()=>$("#qrModal").innerHTML="";
  $("#qrBack").onclick=e=>{ if(e.target.id==="qrBack") $("#qrModal").innerHTML=""; };
  $("#qrCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast("Liga copiada"); }catch(e){ toast(url); } };
}

function exportAll(){
  const s=A.session, byId=Object.fromEntries(A.participants.map(p=>[p.id,p]));
  const totals={}; A.votes.forEach(v=>totals[v.card_id]=(totals[v.card_id]||0)+(v.points||0));
  const cardById=Object.fromEntries(A.cards.map(c=>[c.id,c]));
  const iTot={}; A.ideaVotes.forEach(v=>iTot[v.idea_id]=(iTot[v.idea_id]||0)+1);
  const name = p => ((p.nombre||"")+" "+(p.apellido||"")).trim();
  downloadCSV(`colmena_${s.code}_participantes.csv`,
    [["nombre","apellido","area","rol","etapas","avatar","animo","expectativa","hora_entrada"],
     ...A.participants.map(p=>[p.nombre,p.apellido,p.area,p.rol,(p.etapas||[]).join(" | "),p.emoji,p.mood,p.expectativa,p.joined_at])]);
  downloadCSV(`colmena_${s.code}_dolores.csv`,
    [["dolor","etapa","actividad","herramienta","severidad","votos","autor","area_autor","rol_autor","hora"],
     ...A.cards.map(c=>{const a=byId[c.participant_id]||{};return [c.texto,c.etapa,c.actividad||"",c.herramienta||"",c.severidad,totals[c.id]||0,name(a),a.area||"",a.rol||"",c.created_at];})]);
  if((s.quickwins||[]).length || A.ideas.some(i=>i.kind==="qw")){
    const t=qwCount(A.qwRatings);
    const lab=(k,v)=>scaleLabel(k,v);
    downloadCSV(`colmena_${s.code}_quickwins.csv`,
      [["id","tipo","etapa","texto","origen","puntaje_3","puntaje_2","puntaje_1","puntaje_0","escala_3_2_1_0","indice_0_100","lo_mas_comun","autor","area_autor"],
       ...(s.quickwins||[]).map(q=>{const k=kindOf(q), st=qwStats(t[q.id],k);return [q.id,RATING_KINDS[k].t,q.stage,q.text,k==="qw"?"lámina del cliente":"LOCFY24",st.m,st.a,st.p,st.na,[3,2,1,0].map(v=>lab(k,v)).join(" / "),st.idx??"",k==="time"&&st.mode!==null?lab(k,st.mode):"","",""];}),
       ...A.ideas.filter(i=>i.kind==="qw").map(i=>{const a=byId[i.participant_id]||{};return ["","Propuesta del equipo",i.etapa||"",i.texto,"propuesto en el workshop","","","","","","","",name(a),a.area||""];})]);
  }
  if(A.ideas.some(i=>i.kind==="idea")){
    downloadCSV(`colmena_${s.code}_ideas.csv`,
      [["reto_dolor","etapa_reto","idea","apoyos","autor","area_autor","rol_autor","hora"],
       ...A.ideas.filter(i=>i.kind==="idea").map(i=>{const a=byId[i.participant_id]||{}, c=cardById[i.card_id]||{};return [c.texto||"",c.etapa||"",i.texto,iTot[i.id]||0,name(a),a.area||"",a.rol||"",i.created_at];})]);
  }
  toast("CSV descargados: participantes, dolores, validación (quick wins, reglas, tiempos) e ideas");
}

      <h1 class="p-title" style="margin:0;font-size:34px">${esc(CONFIG.BRAND)}</h1>

      <button class="btn btn-primary" id="lp">Soy participante</button>

  if(code) return startParticipant(code);
  landing();
}
window.addEventListener("hashchange",()=>location.reload());
boot();
