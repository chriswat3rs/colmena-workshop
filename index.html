<style>
/* ============================================================
   COLMENA · Quality & Knowledge — tokens de marca (modo claro)
   Colores corporativos: azul #278FD8 · marino #01133B.
   Accesibilidad (WCAG AA): texto blanco sobre #278FD8 = 3.5:1 (no alcanza
   para texto normal), por eso los botones y el texto van en marino y el
   azul se usa en rellenos, gráficas e iconos; para texto azul sobre claro
   se usa el tono profundo #1B6FAE (5.3:1).
   Tipografía: Montserrat 300–800.
   ============================================================ */
:root{
  --brand-blue:#278FD8; --brand-navy:#01133B;
  --surface:#F4F7FB; --card:#FFFFFF; --ink:#01133B; --ink-2:#46536E; --ink-3:#616D87;
  --line:#DCE3EE; --accent:#278FD8; --accent-strong:#1B6FAE; --accent-ink:#FFFFFF; --accent-soft:#E6F2FB;
  --primary:#01133B; --primary-hover:#0B2A63; --navy-soft:#E9EDF5;
  --honey:#278FD8; --honey-soft:#E6F2FB; --ok:#1B7F5C; --danger:#C2413B;
  --r-card:16px; --r-chip:999px; --shadow:0 2px 12px rgba(1,19,59,.07);
  --sans:'Montserrat',system-ui,-apple-system,sans-serif; --display:'Montserrat',system-ui,sans-serif;
}
/* El panel del facilitador también va en modo claro (se proyecta en sala) */
.admin-theme{ --surface:#F1F5FA; color-scheme:light; }
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);min-height:100dvh;line-height:1.5;font-weight:400;
  background:radial-gradient(900px 620px at 108% -12%,rgba(39,143,216,.16),transparent 62%),radial-gradient(760px 540px at -12% 112%,rgba(1,19,59,.07),transparent 60%),var(--surface);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.18;letter-spacing:-.015em;font-weight:700}
a{color:var(--accent-strong)}
::placeholder{color:var(--ink-3)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- hexágono: el elemento memorable ---------- */
.hex{display:inline-flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
.hex-avatar{width:64px;height:70px;background:var(--accent-soft);font-size:30px}
.hex-avatar.sm{width:38px;height:42px;font-size:18px}
.hex-logo{width:30px;height:34px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:15px}
.honeycells{display:flex;gap:5px}
.honeycell{width:20px;height:23px;background:var(--line);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:background .25s}
.honeycell.full{background:var(--honey)}

/* ---------- capa participante (móvil primero) ---------- */
.p-shell{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:20px 20px calc(96px + env(safe-area-inset-bottom))}
.p-top{display:flex;align-items:center;gap:10px;padding-bottom:14px}
.p-top .sname{font-weight:600;font-size:14px;color:var(--ink-2)}
.p-kicker{color:var(--accent-strong);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.p-title{font-size:27px;font-weight:800;margin-bottom:10px}
.p-sub{color:var(--ink-2);font-size:16px;margin-bottom:22px}
.p-body{flex:1;display:flex;flex-direction:column}
.p-cta{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(244,247,251,.94) 58%,rgba(244,247,251,0));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:520px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;
  border-radius:var(--r-card);font-weight:700;font-size:17px;transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(1,19,59,.18)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{opacity:.35;cursor:default}
.btn-ghost{background:transparent;color:var(--ink-2);font-weight:600;padding:10px}
.btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:14px;color:var(--ink-2);margin-bottom:8px}
.input,textarea.input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{resize:vertical;min-height:110px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:var(--r-chip);border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;transition:all .15s}
.chip.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
/* Participante v1.4: barra de actividad, estados «listo», borradores, ergonomía */
.chips-tall .chip{min-height:44px}
.chip.chip-all{border-style:dashed;color:var(--accent-strong)}
.chip.chip-all.on{border-style:solid;color:#fff}
.p-shell.tall-cta{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.p-cta .btn+.btn{margin-top:6px}
.cta-hint{font-size:13px;color:var(--ink-3);text-align:center;margin:8px 0 0;min-height:0;font-weight:500}
.cta-hint:empty{display:none}
.p-top.pbar{display:block;position:sticky;top:0;z-index:6;background:rgba(244,247,251,.9);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);margin:-20px -20px 0;padding:14px 20px 10px;border-bottom:1px solid rgba(220,227,238,.7)}
.pb-row{display:flex;align-items:center;gap:10px}
.pb-t{font-size:15px;color:var(--ink-2);font-weight:600;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-t b{color:var(--ink);font-weight:800}
.pb-pill{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);letter-spacing:.02em}
.pb-pill.listo{background:#E3F5EA;color:#1E7A45}
.pb-pill.espera{background:#EEF1F6;color:var(--ink-3)}
.pb-segs{display:flex;gap:4px;margin-top:8px}
.pb-seg{flex:1;min-width:0}
.pb-seg i{display:block;height:5px;border-radius:3px;background:var(--line)}
.pb-seg.done i{background:var(--accent)}
.pb-seg.cur i{background:var(--accent-strong)}
.pb-seg em{display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-seg.cur em{color:var(--ink);font-weight:700}
.pb-new{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;line-height:1.4;transition:opacity .4s,transform .4s}
.pb-new b{font-weight:700}
.pb-new.out{opacity:0;transform:translateY(-6px)}
.p-top.pbar+.sticky-votes{top:0}
.p-top.pbar~.p-body{padding-top:16px}
.dn{background:var(--card);border:1.5px solid #BFE5CC;border-radius:var(--r-card);padding:16px;margin:0 0 18px;box-shadow:var(--shadow)}
.done-h{display:flex;align-items:flex-start;gap:12px}
.done-h h2{font-size:19px;font-weight:800;margin:0 0 3px;line-height:1.2}
.done-peers{margin:0;font-size:14.5px;color:var(--ink-2);font-weight:600}
.done-sub{margin:12px 0 0;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.done-next{margin:10px 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.45}
.done-next b{color:var(--ink)}
.done-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.done-act .btn{width:auto;flex:1}
.btn.btn-sm{padding:11px 14px;font-size:15px}
.dn.end{border-color:var(--line);margin-top:22px}
.mine-h{font-weight:700;font-size:14px;color:var(--ink-2);margin:8px 0 10px}
.mycard{position:relative}
.mycard.just{border-color:#5BBE84;animation:justin .5s ease-out}
@keyframes justin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.pubok{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:#1E7A45;background:#E3F5EA;padding:3px 8px;border-radius:999px}
.mycard.just .txt{padding-right:92px}
.votecard.voted{border-color:var(--accent)}
.qw-band{justify-content:space-between}
.qw-band .qw-n{color:var(--ink-2);font-weight:600}
.qw-band .qw-n b{color:var(--ink);font-weight:800}
.qwcard.focus{box-shadow:0 0 0 3px rgba(39,143,216,.35)}
.sheet{position:fixed;inset:0;background:rgba(1,19,59,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet-card{background:var(--card);border-radius:18px;padding:20px;max-width:480px;width:100%;box-shadow:0 16px 40px rgba(1,19,59,.3)}
.sheet-card h3{font-size:18px;font-weight:800;margin:0 0 6px}
.sheet-card p{color:var(--ink-2);font-size:14.5px;margin:0 0 8px}
.sheet-card blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;font-size:15px;white-space:pre-wrap}
.offline{position:fixed;top:0;left:0;right:0;z-index:80;background:#8A4B00;color:#fff;font-size:13.5px;font-weight:600;text-align:center;padding:8px 12px}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent-strong)}
.mood-row{display:flex;flex-direction:column;gap:10px}
.mood-opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-card);background:var(--card);font-weight:600;font-size:16px;text-align:left}
.mood-opt.on{border-color:var(--accent-strong);background:var(--accent-soft)}
.slider-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);padding:16px}
.slider-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:8px}
input[type=range]{width:100%;accent-color:var(--accent-strong);height:32px}
.sev-now{font-weight:700;font-size:15px;text-align:center;margin-top:4px}
.wait-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mycard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.mycard .txt{font-size:16px;margin-bottom:8px}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-chip);background:var(--accent-soft);color:var(--accent-strong)}
.tag.sev{background:var(--navy-soft);color:var(--ink)}
.del{margin-left:auto;color:var(--danger);font-weight:600;font-size:13.5px}
.votecard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:12px}
.votecard .txt{font-size:16.5px;margin-bottom:10px}
.vote-ctrl{display:flex;align-items:center;gap:12px;margin-top:10px}
.vbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.vbtn:disabled{opacity:.3}
.vcount{min-width:70px;display:flex;align-items:center;gap:6px;font-weight:700}
.vhex{width:16px;height:18px;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sticky-votes{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.78);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid rgba(220,227,238,.7);margin:0 -20px;padding:10px 20px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:var(--r-chip);font-weight:600;font-size:14.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.banner-demo{background:#FFF6DC;color:#6B4E00;border-bottom:1.5px solid #E8B93A;padding:8px 16px;font-size:13.5px;font-weight:600;text-align:center}
.err{color:var(--danger);font-weight:600;font-size:14.5px;margin-top:8px}

/* ---------- capa admin ---------- */
.a-shell{min-height:100dvh;display:flex;flex-direction:column}
.a-top{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.a-top .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px}
.a-title{font-size:16px;font-weight:700}
.a-code{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.16em;color:#fff;background:var(--primary);padding:5px 14px;border-radius:10px}
.a-actions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.abtn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--card)}
.abtn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.abtn.danger{color:var(--danger);border-color:var(--danger)}
.phasebar{display:flex;gap:8px;padding:14px 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.phase{padding:10px 18px;border-radius:var(--r-chip);border:1.5px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink-2);background:var(--card)}
.phase.on{background:var(--primary);border-color:var(--primary);color:#fff}
.phase.done{color:var(--ink);border-color:var(--accent)}
.a-main{flex:1;padding:22px;display:flex;flex-direction:column;gap:22px;max-width:1280px;width:100%;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.panel h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h2 .sub{font-family:var(--sans);font-weight:500;font-size:13.5px;color:var(--ink-2)}
.wcard.new,.icard.new{animation:cardin .35s ease}
@keyframes cardin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{text-align:left;color:var(--ink-2);font-weight:700;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:9px 10px;border-bottom:1px solid var(--line)}
.ptable tr:last-child td{border-bottom:none}
/* ranking (dataviz: barras delgadas, un solo tono, remate 4px, etiquetas en tinta) */
.qr-modal{position:fixed;inset:0;background:rgba(10,8,26,.72);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.qr-box{background:#fff;color:#01133B;border-radius:20px;padding:28px;max-width:420px;width:100%;text-align:center}
.qr-box h2{font-size:20px;margin-bottom:4px}
.qr-box .code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.18em;color:#01133B;margin:8px 0 14px}
#qrTarget{display:flex;justify-content:center;margin-bottom:14px}
#qrTarget img,#qrTarget canvas{border-radius:12px}
.qr-link{font-size:13px;color:#46536E;word-break:break-all;margin-bottom:16px}
.a-login{max-width:560px;margin:0 auto;padding:40px 22px;display:flex;flex-direction:column;gap:20px}
.a-login .panel{padding:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.hint{font-size:13px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:14.5px;padding:14px 0;text-align:center}
/* ---------- v1.2: perfil, herramienta, quick wins e ideas ---------- */
.opt{font-weight:500;color:var(--ink-3)}
.btn-link{margin-top:14px;align-self:flex-start;color:var(--accent-strong);font-weight:700;font-size:15px;padding:6px 0}
.tag.tool{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.tag.mine{background:var(--ink);color:var(--card)}
.sec-title{font-family:var(--display);font-size:20px;font-weight:700;margin:26px 0 6px}
.stage-h{font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.qwcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.qwcard.done{border-color:var(--accent)}
.qwcard .txt{font-size:16px;margin:4px 0 12px}
.qw-id{font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:11px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;min-height:44px}
.seg button.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.seg button[data-v="0"].on{background:var(--ink-2);border-color:var(--ink-2);color:var(--card)}
details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-weight:700;color:var(--accent-strong);padding:10px 0;font-size:15px}
.reto{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--r-card);padding:14px 16px;margin:14px 0 16px}
.reto .rk{font-size:12px;font-weight:800;color:var(--accent-strong);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.reto .txt{font-size:16.5px;font-weight:600;margin-bottom:8px}
.ideacard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.ideacard .txt{font-size:16px;margin-bottom:10px}
.support{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-chip);border:1.5px solid var(--line);font-weight:700;font-size:14px;min-height:40px}
.support.on{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent-strong)}
.support .vhex{width:13px;height:15px}
/* admin: tabla de quick wins (barras apiladas ordinales, un solo tono + gris para «no aplica») */
.ptable .et{font-size:12.5px;color:var(--ink-2)}
.panel h2 .right{margin-left:auto}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:92px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--accent-strong)}
/* ---------- Marca: imagotipo y logotipo Quality & Knowledge ---------- */
.brand-mark{width:30px;height:30px;object-fit:contain;flex:none;display:block}
.brand-mark.lg{width:96px;height:96px}
.brand-mark.md{width:40px;height:40px}
.qk-logo{height:46px;width:auto;display:block}
.qk-by{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.brand-by{font-weight:600;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.hero-mark{filter:drop-shadow(0 10px 24px rgba(1,19,59,.16))}

/* ---------- Logo de Colmena (hexágono «C») y lockup Colmena + Quality & Knowledge ---------- */
.cm-wrap{display:inline-grid;flex:none;filter:drop-shadow(0 8px 18px rgba(1,19,59,.20)) drop-shadow(0 1px 2px rgba(1,19,59,.15))}
.cm-mark{--s:88px;position:relative;width:var(--s);height:calc(var(--s)*1.1);display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#5AB4EE 0%,#278FD8 42%,#0E3A7A 78%,#01133B 100%);
  color:#fff;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.48);line-height:1}
.cm-mark::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(95% 55% at 32% 10%,rgba(255,255,255,.62),rgba(255,255,255,.12) 45%,rgba(255,255,255,0) 62%)}
.cm-mark span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(1,19,59,.35);transform:translateY(-2%)}
.cm-wrap.sm{filter:drop-shadow(0 2px 5px rgba(1,19,59,.18))}.cm-wrap.sm .cm-mark{--s:28px}
.cm-wrap.md .cm-mark{--s:40px}
/* Lockup abeja + imagotipo: misma jerarquía visual.
   Un hexágono de igual alto que un círculo tiene ~13% menos área, así que va un 13% más alto y con relleno más firme. */
.lockup{--lk:92px;display:flex;align-items:center;justify-content:center;gap:calc(var(--lk)*.2)}
.lockup.sm{--lk:40px}
.lockup.xs{--lk:30px;justify-content:flex-start}
.lockup .brand-mark{width:var(--lk);height:var(--lk)}
.bee-mark{width:var(--lk);height:calc(var(--lk)*1.13);font-size:calc(var(--lk)*.64);line-height:1;background:#CFE5F7}
.lockup-plus{font-family:var(--display);font-weight:300;font-size:calc(var(--lk)*.46);line-height:1;color:var(--ink-3)}
.lockup.xs .lockup-plus{font-weight:400}
/* ---------- Iconos planos: fondo suave del tono y glifo SVG de trazo 1.9 px ---------- */
.glass{--g:var(--brand-blue);position:relative;display:inline-grid;place-items:center;flex:none;width:56px;height:56px;border-radius:28%;
  color:var(--g);background:color-mix(in srgb,var(--g) 12%,#fff)}
.glass svg{width:52%;height:52%;overflow:visible}
.glass.tint,.avatar-pick.on .glass:not(.ava),.mood-opt.on .glass{color:#fff;background:var(--g)}
.glass.xl{width:104px;height:104px}.glass.lg{width:76px;height:76px}.glass.md{width:44px;height:44px}
.glass.sm{width:36px;height:36px}.glass.xs{width:22px;height:22px;border-radius:30%}
.t-blue{--g:#278FD8}.t-navy{--g:#173F84}.t-sky{--g:#4FA9E6}.t-deep{--g:#1B6FAE}
.t-green{--g:#1FA971}.t-slate{--g:#7A879F}.t-amber{--g:#F0962E}.t-coral{--g:#E5484D}
.avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;justify-items:center}
.avatar-pick{width:100%;max-width:84px;padding:5px;border-radius:24px;border:2px solid transparent;background:none;transition:transform .12s;display:grid;place-items:center}
.avatar-pick .glass{width:100%;height:auto;aspect-ratio:1}
/* Avatares de animales sobre un fondo suave del tono */
.glass.ava .ava-emoji{position:relative;line-height:1;font-size:28px}
.glass.ava.xl .ava-emoji{font-size:56px}.glass.ava.lg .ava-emoji{font-size:40px}.glass.ava.md .ava-emoji{font-size:23px}
.glass.ava.sm .ava-emoji{font-size:19px}.glass.ava.xs .ava-emoji{font-size:12px}
.avatar-pick .glass.ava .ava-emoji{font-size:clamp(26px,9.5vw,42px)}
.avatar-pick.on .glass.ava{box-shadow:0 0 0 3px var(--accent);background:#DCEEFB}
.avatar-pick.on{border-color:transparent;background:none;transform:scale(1.04)}
.avatar-pick:active{transform:scale(.96)}
.avatar-pick.on{border-color:var(--accent-strong);background:rgba(39,143,216,.06)}
.mood-opt .glass{width:50px;height:50px}
.mood-opt .glass svg{width:64%;height:64%}
.who .glass.xs svg{width:66%;height:66%}
.mood-opt.on{box-shadow:0 0 0 2px var(--accent-strong) inset}
.who{display:inline-flex;align-items:center;gap:6px}
.wait-hero .glass{margin-bottom:6px}
/* ---------- Inicio del facilitador: tablero responsivo ---------- */
.ah-shell{min-height:100dvh;display:flex;flex-direction:column}
.ah-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;
  padding:12px clamp(16px,3vw,36px);background:rgba(244,247,251,.82);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line)}
.ah-top .brand-name{font-size:17px}
.ah-user{display:flex;align-items:center;gap:12px;min-width:0}
.ah-mail{font-size:13px;color:var(--ink-2);font-weight:500;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ah-main{width:100%;max-width:1320px;margin:0 auto;padding:clamp(16px,3vw,36px);display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:clamp(16px,2.2vw,28px);align-items:start}
.ah-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:clamp(16px,2vw,22px);min-width:0}
.ah-form{padding:clamp(18px,2.6vw,32px);min-width:0}
.ah-form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:6px}
.ah-form-head .chip{padding:9px 14px;font-size:14px}
.ah-sec{border-top:1px solid var(--line);padding:20px 0 6px;margin-top:14px}
.ah-sec-t{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:15.5px;font-weight:800;margin-bottom:14px;color:var(--ink)}
.ah-sec-t span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);font-size:12.5px;font-weight:800;flex:none}
details.ah-sec>summary{cursor:pointer;list-style:none;margin-bottom:0}
details.ah-sec>summary::-webkit-details-marker{display:none}
details.ah-sec>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s}
details.ah-sec[open]>summary::after{transform:rotate(-135deg)}
details.ah-sec[open]>summary{margin-bottom:4px}
.ah-sec-t em{font-style:normal}
.ah-form .field label .opt{font-weight:500;font-size:12.5px;margin-left:4px}
.admin-theme .ah-form .input{font-size:15px;padding:12px 14px;border-radius:11px}
.admin-theme .ah-form textarea.input{font-size:14px;line-height:1.55;min-height:0}
.ah-form .input.mono{font-size:13.5px}
.g3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.ah-form .grid2{gap:12px 14px}
.ah-actions{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;
  margin:18px calc(-1 * clamp(18px,2.6vw,32px)) calc(-1 * clamp(18px,2.6vw,32px));padding:16px clamp(18px,2.6vw,32px);
  background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:0 0 var(--r-card) var(--r-card)}
.ah-create{padding:13px 28px;font-size:15px}
.tl-list{display:flex;flex-direction:column;gap:10px}
.tl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tl-name{grid-column:1/-1;font-weight:700;font-size:14.5px;line-height:1.35}
.tl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tl-code{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:12.5px;color:#fff;background:var(--primary);padding:3px 8px;border-radius:7px}
.tl-item .abtn{padding:8px 14px;font-size:13.5px}
.tl-empty{display:flex;align-items:center;gap:14px;padding:6px 0;color:var(--ink-2);font-size:14px}
.ah-how h2{margin-bottom:10px}
.ah-steps{margin:0 0 0 18px;display:grid;gap:8px;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.ah-steps strong{color:var(--ink)}
@media (max-width:1024px){
  .ah-main{grid-template-columns:1fr}
  .ah-side{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
}
@media (max-width:720px){
  .g3{grid-template-columns:1fr}
  .g3 .field[style*="span 2"]{grid-column:auto!important}
  .ah-how{display:none}
  .ah-mail{max-width:48vw}
  .ah-actions .hint{display:none}
  .ah-create{width:100%}
}
/* ---------- Panel del taller: encabezado y KPIs responsivos ---------- */
.a-top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 20px;
  padding:12px clamp(14px,2.5vw,28px);background:rgba(244,247,251,.85);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.a-head{display:flex;align-items:center;gap:12px;min-width:0}
.a-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-top .a-actions{margin-left:0;flex-wrap:nowrap;justify-content:flex-end}
.a-actions .abtn{padding:9px 14px;font-size:13.5px;white-space:nowrap}
.phasebar{padding:12px clamp(14px,2.5vw,28px)}
.a-main{padding:clamp(14px,2.5vw,28px)}
@media (max-width:1200px){
  .a-top{grid-template-columns:auto minmax(0,1fr)}
  .a-top .a-actions{grid-column:1/-1;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .a-top .a-actions #btnQR{order:-1}
  .a-top .a-actions::-webkit-scrollbar{display:none}
}
@media (max-width:720px){
  .a-top{grid-template-columns:minmax(0,1fr)}
  .a-top .brand .brand-by{display:none}
  .a-head{justify-content:space-between}
  .a-title{white-space:normal;font-size:15px;line-height:1.3}
  .a-code{font-size:16px;padding:4px 10px;flex:none}
  .a-top .a-actions{margin:0 calc(-1 * clamp(14px,2.5vw,28px));padding:0 clamp(14px,2.5vw,28px) 2px}
  .panel{padding:16px}
}
/* ================= Panel: tarjetas y gráficas (v1.4) =================
   Mismo lenguaje en todas las tarjetas: título, descripción, gráfica y un pie con el dato destacado.
   Paleta monocroma en el azul de la marca (validada: la escala Poco→Mucho pasa las comprobaciones ordinales). */
:root{--c1:#278FD8;--c2:#7FBAEC;--c3:#15588F;--c-light:#A9D3F3;--c-track:#EDF3FA;--lk-m:#15588F;--lk-a:#3A97DC;--lk-p:#7FBAEC}
.ico-line{display:inline-grid;place-items:center;width:20px;height:20px;color:var(--ink-3);flex:none}
.ico-line svg{width:18px;height:18px}
.panel{padding:22px 24px 18px}
.ph{margin-bottom:18px}
.ph h2{display:block;font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.3}
.pdesc{font-size:13.5px;font-weight:500;color:var(--ink-3);margin:0;line-height:1.4}
.pf{display:flex;flex-direction:column;gap:4px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.pf-main{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}
.pf-main svg{width:16px;height:16px;flex:none;stroke-width:2.2;color:var(--ink)}
.pf-sub{font-size:13px;font-weight:500;color:var(--ink-3)}
.duo{display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:16px;align-items:start}
.leg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:14px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}
.leg i.m{background:var(--lk-m)}.leg i.a{background:var(--lk-a)}.leg i.p{background:var(--lk-p)}
.leg .leg-help{font-weight:500;color:var(--ink-3);margin-left:auto}

/* Indicadores: seis tarjetas con la misma estructura */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding-top:4px}
.kpi{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 18px 16px;box-shadow:0 1px 2px rgba(1,19,59,.04)}
.kpi.on{border-color:#8EC3EC;box-shadow:0 0 0 3px rgba(39,143,216,.12)}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.kpi-l{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-live{position:absolute;top:-10px;right:14px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#fff;background:var(--primary);padding:3px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(1,19,59,.18)}
.kpi-live i{width:6px;height:6px;border-radius:50%;background:#6FC0F5;animation:livepulse 1.6s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.kpi-live i{animation:none}}
.kpi-v{display:flex;align-items:baseline;gap:6px;min-width:0;margin:2px 0 4px}
.kpi-v .n{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.kpi-v .of{font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.kpi-f{display:flex;flex-direction:column;gap:3px;margin-top:auto;min-width:0}
.kpi-f1{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35}
.kpi-f2{font-size:12.5px;font-weight:500;color:var(--ink-3);line-height:1.35}
.kpi-f1,.kpi-f2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Estado vacío */
.empty-st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 12px 22px;text-align:center}
.empty-st .glass{margin-bottom:6px}
.empty-st b{font-size:14px;font-weight:600;color:var(--ink)}
.empty-st span{font-size:13px;color:var(--ink-3);font-weight:500}
.qwl.quiet{margin-top:6px}
.qwl-idx.zero{color:var(--ink-3)}

/* Columnas apiladas (dolores por etapa) */
.bars-v{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(6px,1.5vw,20px);height:240px;padding-top:22px}
.bars-v::before{content:"";position:absolute;left:0;right:0;top:22px;bottom:22px;background:linear-gradient(to top,var(--line) 1px,transparent 1px) 0 0/100% 25% repeat-y;pointer-events:none}
.bars-v .bv{position:relative}
.bv{display:flex;flex-direction:column;height:100%;min-width:0}
.bv-stack{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.bv-stack i{display:block;min-height:0}
.bv-stack .hi{background:var(--c3);border-radius:0 0 0 0}
.bv-stack .lo{background:var(--c2)}
.bv-stack i:first-of-type{border-radius:8px 8px 0 0}
.bv-n{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.bv-x{height:22px;padding-top:8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Barras horizontales (ranking) */
.hb{display:flex;flex-direction:column;gap:10px}
.hb-row{display:grid;grid-template-columns:minmax(180px,36%) minmax(0,1fr);gap:18px;align-items:center}
.hb-lbl{display:flex;gap:10px;align-items:flex-start;min-width:0}
.hb-pos{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--navy-soft);color:var(--ink-2);margin-top:1px}
.hb-row.top .hb-pos{background:var(--primary);color:#fff}
.hb-t{min-width:0}
.hb-txt{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hb-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.hb-reto{font-size:10.5px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.hb-track{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:10px;align-items:center}
.hb-rail{display:block;min-width:0}
.hb-bar{display:block;height:34px;border-radius:8px;background:var(--c-light);min-width:6px;transition:width .5s ease}
.hb-row.top .hb-bar{background:var(--c1)}
.hb-val{font-size:14px;font-weight:700;color:var(--ink)}
.hb-more{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;background:#E3E8EF}
.pips i.on{background:var(--c1)}

/* Quick wins: columnas al 100 % + lista */
.qwc-wrap{overflow-x:auto;padding-bottom:4px}
.qwc{display:grid;grid-template-columns:repeat(var(--n),minmax(30px,1fr));gap:clamp(4px,1vw,14px);align-items:end;min-width:min(100%,calc(var(--n)*36px))}
.qwc-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.qwc-idx{text-align:center;font-size:12px;font-weight:700;color:var(--ink)}
.qwc-stack{height:190px;display:flex;flex-direction:column;gap:2px;border-radius:8px;overflow:hidden;background:var(--card)}
.qwc-stack.none{background:var(--c-track)}
.qwc-stack i{display:block;min-height:0}
.qwc-stack .p{background:var(--lk-p)}.qwc-stack .a{background:var(--lk-a)}.qwc-stack .m{background:var(--lk-m)}
.qwc-stack .t0,.leg i.t0{background:#B9D9F3}.qwc-stack .t1,.leg i.t1{background:#7FBAEC}.qwc-stack .t2,.leg i.t2{background:#3A97DC}.qwc-stack .t3,.leg i.t3{background:#15588F}
.qwc-stack.tm{flex-direction:column-reverse}
.wc-tool.act{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.qwc-id{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.qwl{columns:2 380px;column-gap:28px;margin-top:20px}
.qwl-row,.qwl-stage{break-inside:avoid}
.qwl-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qwl-t{font-weight:600;color:var(--ink);line-height:1.35}
.qwl-idx{text-align:right;font-weight:700;font-size:15px;color:var(--ink);line-height:1.1;min-width:44px}
.qwl-idx small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:1px}
.qwl-idx .na{color:var(--ink-3)}
.qwl-stage{font-size:11.5px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;padding:16px 0 4px}

/* Retos e ideas */
.retos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.reto{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.reto-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reto-k{flex:none;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--primary);padding:4px 10px;border-radius:999px}
.reto-m{min-width:0;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reto-t{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--ink);line-height:1.35;margin:10px 0 6px}
.ideas{list-style:none;margin:0;padding:0}
.idea{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-top:1px solid var(--line)}
.idea.new{animation:cardin .35s ease}
.idea-t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.idea-t .who{display:flex;margin-top:4px;font-size:12px;color:var(--ink-3);font-weight:600}
.idea-b{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:10px;align-items:center}
.idea-rail{display:block;min-width:0}
.idea-rail i{display:block;height:18px;border-radius:6px;background:var(--c-light);min-width:4px}
.idea.lead .idea-rail i{background:var(--c1)}
.idea-b b{font-size:13.5px;font-weight:700;color:var(--ink)}
.empty-idea{color:var(--ink-3);font-size:13.5px;text-align:center}

/* Dona de ánimo */
.donut-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.donut{width:160px;height:160px;flex:none}
.donut-n{font-family:var(--sans);font-size:32px;font-weight:700;fill:var(--ink)}
.donut-s{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink-3)}
.dleg{display:flex;flex-direction:column;gap:9px;min-width:0}
.dleg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto 40px;gap:10px;align-items:center;font-size:13.5px}
.dleg-row.zero{opacity:.45}
.dleg-row .sw{width:10px;height:10px;border-radius:3px}
.dleg-row .dl-t{font-weight:600;color:var(--ink);line-height:1.3}
.dleg-row b{font-weight:700}
.dleg-row .pct{text-align:right;color:var(--ink-3);font-weight:600;font-size:12.5px}

/* Muro de dolores y propuestas */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.wall.props{gap:12px}.wall.props .wcard{margin:0}
.wcol h3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #E3EAF3}
.wcol h3 b{flex:none;font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--navy-soft);padding:2px 9px;border-radius:999px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(1,19,59,.04)}
.wcard.new{animation:cardin .35s ease}
.wc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:22px}
.wc-sev{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.wc-votes{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.wc-kind{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--accent-strong)}
.wc-kind svg{width:14px;height:14px}
.hx{display:inline-block;width:9px;height:10.5px;background:currentColor;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.wcard .txt{font-size:14.5px;line-height:1.45;color:var(--ink)}
.wc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.wc-tool{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.wcard .who{font-size:12px;color:var(--ink-3);font-weight:600}

/* ===== Resultados v1.4: titular, cinco secciones numeradas, una forma por sección, contexto plegado ===== */
.a-main.results{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.a-main.results>.panel,.a-main.results .duo2>.panel{padding:28px 28px 24px}
.hero{padding:8px 4px 0}
.hero-ctx{font-size:16px;font-weight:600;color:var(--ink-3);margin:0 0 22px}
.hero-l{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin:0 0 8px}
.hero-t{font-family:var(--sans);font-size:32px;line-height:1.2;font-weight:800;color:var(--ink);margin:0 0 10px;max-width:34ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-t.muted{color:var(--ink-3)}
.hero-s{font-size:16px;font-weight:600;color:var(--ink-2);margin:0 0 26px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 20px 18px;box-shadow:0 1px 2px rgba(1,19,59,.04);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:#8EC3EC;transform:translateY(-1px)}
.tile.nodata{background:transparent;border-style:dashed}
.tile-l{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.tile-v{font-size:20px;font-weight:700;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.nodata .tile-v{color:var(--ink-3);font-weight:600;font-size:18px}
.tile-s{font-size:14px;font-weight:600;color:var(--ink-2);margin-top:auto}
.ph.sec{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.sec-n{flex:none;font-family:var(--display);font-size:32px;line-height:1;font-weight:700;color:var(--accent);min-width:28px}
.ph.sec h2{font-size:22px;line-height:1.2;margin-bottom:6px}
.ph.sec .pdesc{font-size:15px}
.a-main.results .pf-main{font-size:16px}
.a-main.results .pf-sub{font-size:14px}
.duo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.more-a{margin-top:14px}
.more-a>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--accent-strong);padding:8px 0}
.more-a>summary::-webkit-details-marker{display:none}
.more-a>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
.more-a[open]>summary::before{transform:rotate(45deg)}
.more-a>div{margin-top:8px}
details.ctx{border-top:1px solid var(--line);padding-top:18px}
details.ctx>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:12px;padding:6px 4px}
details.ctx>summary::-webkit-details-marker{display:none}
details.ctx>summary::before{content:"";align-self:center;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .2s}
details.ctx[open]>summary::before{transform:rotate(45deg)}
.ctx-t{font-size:18px;font-weight:700;color:var(--ink)}
.ctx-s{font-size:14px;font-weight:500;color:var(--ink-3)}
.ctx-body{display:flex;flex-direction:column;gap:20px;margin-top:20px}
.ctx-line{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink-2);margin:0}
/* Unidades (hexágonos) */
.hxu{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.hxu i{display:block;width:14px;height:16px;background:var(--c-track);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hxu i.on{background:var(--c1)}
.hxu.m i.on{background:var(--lk-m)}.hxu.a i.on{background:var(--lk-a)}.hxu.p i.on{background:var(--lk-p)}
/* 1 · Ranking: etiqueta encima de la barra */
.rk{display:flex;flex-direction:column;gap:16px}
.rk-row{display:flex;flex-direction:column;gap:6px;min-width:0}
.rk-h{display:flex;align-items:center;gap:10px;min-width:0}
.rk-pos{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--navy-soft);color:var(--ink-2)}
.rk-row.top .rk-pos{background:var(--primary);color:#fff}
.rk-txt{font-size:16px;font-weight:600;color:var(--ink);line-height:1.3;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-meta{font-size:13px;font-weight:600;color:var(--ink-3);padding-left:36px}
.rk-bar{display:flex;align-items:center;gap:12px;padding-left:36px}
.rk-bar i{display:block;height:20px;border-radius:6px;background:var(--c-light);min-width:6px;flex:0 1 auto;transition:width .5s ease}
.rk-row.top .rk-bar i{background:var(--c1)}
.rk-bar b{font-size:22px;font-weight:700;color:var(--ink);line-height:1}
.rk-units{display:flex;align-items:center;gap:10px;padding-left:36px}
.rk-units b{font-size:15px;font-weight:700;color:var(--ink)}
.a-main.results .rk-txt{font-size:18px}
/* 3 · Likert horizontal */
.lk{display:flex;flex-direction:column}
.lk-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lk-row .lk-t{grid-column:1/-1}
.lk-row.small{grid-template-columns:minmax(0,1fr)}
.panel{container-type:inline-size}
@container (min-width:900px){ .lk-row:not(.small),.dv-row:not(.small){grid-template-columns:minmax(0,1fr) minmax(300px,44%) 64px} .lk-row:not(.small) .lk-t,.dv-row:not(.small) .lk-t{grid-column:auto} }
.lk-t{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;min-width:0}
.lk-id{display:inline-block;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;margin-right:8px}
.lk-few{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:999px;vertical-align:1px}
.lk-bar{display:flex;height:24px;border-radius:7px;overflow:hidden;background:var(--c-track);gap:2px}
.lk-bar i{display:flex;align-items:center;justify-content:center;min-width:0;font-size:12px;font-weight:700;color:#fff;font-style:normal}
.lk-bar .m{background:var(--lk-m)}.lk-bar .a{background:var(--lk-a)}.lk-bar .p{background:var(--lk-p);color:var(--ink)}
.lk-bar .none{flex:1;background:var(--c-track)}
.lk-idx{text-align:right;font-weight:700;font-size:22px;color:var(--ink);line-height:1}
.lk-idx small{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-top:3px}
.lk-idx.zero{color:var(--ink-3)}
.lk-u{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.lk-na{font-size:13px;font-weight:600;color:var(--ink-3)}
/* 4 · Divergente */
.dv{display:flex;flex-direction:column}
.dv-h{font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;padding:14px 0 4px}
.dv-h.low{color:#8A4B00}
.dv-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dv-row .lk-t{grid-column:1/-1}
.dv-row.small{grid-template-columns:minmax(0,1fr)}
.dv-bar{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;height:24px}
.dv-bar .l,.dv-bar .r{display:flex;height:100%;min-width:0}
.dv-bar .l{justify-content:flex-end}
.dv-bar .l i,.dv-bar .r i{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;font-weight:700;font-style:normal;min-width:0}
.dv-bar .l i{background:var(--lk-p);color:var(--ink);border-radius:7px 0 0 7px}
.dv-bar .r i{background:var(--lk-m);color:#fff;border-radius:0 7px 7px 0}
.dv-bar .c{position:relative;height:100%;display:grid;place-items:center}
.dv-bar .c::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ink-2);transform:translateX(-50%)}
.dv-bar .c em{position:relative;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--card);border:1.5px solid var(--ink-2);padding:1px 6px;border-radius:999px;line-height:1.3}
.leg i.mid{background:var(--card);border:2px solid var(--ink-2);box-sizing:border-box}
.dv-u{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.dv-u .l{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.dv-u .r{display:flex;gap:6px;align-items:center}
.dv-u .c{height:22px;border-left:2px solid var(--ink-2);justify-self:center}

      },

      quickwins: [
        {id:"QW-01", kind:"qw", stage:"1 Preparar propuesta", text:"Generar propuestas de manera masiva desde el sistema (cubriría ~90% de las renovaciones)", help:"Hoy cada propuesta de renovación se arma una por una en SIGER con su layout. La idea es cargar un solo archivo con muchas renovaciones y que el sistema genere todas las propuestas de una vez. Según la lámina cubriría cerca del 90 % de las renovaciones."},

        {id:"QW-06", kind:"qw", stage:"5 Analizar supuestos", text:"Concentrar las bajas históricas en una sola base para analizar rotación y despido más rápido", help:"Hoy las bajas de cada año viven en archivos separados. Si todas estuvieran en una sola base, el análisis de rotación y despido (cuántos se van y por qué) saldría más rápido y con más años de historia."},
        {id:"QW-07", kind:"qw", stage:"5 Analizar supuestos", text:"Generar automáticamente la Carta de Supuestos", help:"La carta que se manda al cliente con las hipótesis (tasa, rotación, incrementos salariales) se llenaría sola desde el cuadro de hipótesis, en vez de redactarla a mano cada vez."},
        {id:"QW-08", kind:"qw", stage:"5 Analizar supuestos", text:"Incorporar al proveedor de precios", help:"Traer las curvas de tasas de un proveedor de precios directamente al cálculo de la tasa de descuento, en lugar de bajarlas y pegarlas a mano en el archivo de tasa."},
        {id:"QW-09", kind:"qw", stage:"5 Analizar supuestos", text:"Incorporar análisis adicionales estándar", help:"Tener listos, como parte del análisis de supuestos, los análisis que hoy se hacen solo cuando alguien los pide: distribuciones por edad y antigüedad, comparativos contra el año anterior, etc."},
        {id:"QW-10", kind:"qw", stage:"6 Determinación de pasivos", text:"Parametrizar beneficios y criterios de programación", help:"Que los beneficios (prima de antigüedad, indemnizaciones, plan) y sus reglas se configuren eligiendo opciones, no programando cada caso en ProVal desde cero."},
        {id:"QW-11", kind:"qw", stage:"6 Determinación de pasivos", text:"Estandarizar las salidas del sistema", help:"Que los resultados y listados que da ProVal salgan siempre con el mismo formato y columnas, para que el anexo y el reporte los tomen sin retrabajo."},
        {id:"QW-12", kind:"qw", stage:"7 Anexo contable", text:"Mejorar las macros para sacar PDF y XLS en bulk", help:"Que las macros del anexo generen de un jalón los PDF y Excel de todas las empresas de un grupo, en vez de correrlas una por una."},
        {id:"QW-13", kind:"qw", stage:"7 Anexo contable", text:"Versiones cortas del formato del anexo", help:"Un anexo contable resumido para los clientes que no necesitan el detalle completo: menos hojas que armar y revisar."},
        {id:"QW-14", kind:"qw", stage:"7 Anexo contable", text:"Estandarizar criterios para insumos", help:"Definir de una vez qué datos y con qué reglas entran al anexo (qué cuenta, qué periodo, qué se concilia), para que no cambie según quién lo arma."},
        {id:"QW-15", kind:"qw", stage:"7 Anexo contable", text:"Automatizar insumos (ya en curso)", help:"Que los datos que alimentan el anexo (resultados de ProVal, cifras del año anterior) se carguen solos en lugar de copiarlos a mano. Ya se está trabajando en esto."},
        {id:"QW-16", kind:"qw", stage:"7 Anexo contable", text:"Estandarizar el análisis de variaciones", help:"Un mismo método para explicar por qué cambió el pasivo respecto al año anterior (por tasa, por rotación, por salarios…), igual en todas las empresas."},
        {id:"QW-17", kind:"qw", stage:"8 Reportes", text:"Versiones cortas del formato del reporte", help:"Un reporte más breve para los clientes que no requieren el documento completo, en vez de recortar el largo a mano cada vez."},
        {id:"QW-18", kind:"qw", stage:"8 Reportes", text:"Estandarizar insumos parametrizados en BD y anexos contables", help:"Que el reporte tome sus cifras y tablas directamente de la base de datos y del anexo contable, con campos fijos, en lugar de copiarlas de varios archivos."},
        {id:"QW-19", kind:"qw", stage:"8 Reportes", text:"Automatizar insumos (ya en curso)", help:"Que tablas, gráficas y cifras del reporte se llenen solas desde el anexo y las estadísticas. Ya se está trabajando en esto."},
        {id:"RG-01", kind:"gate", stage:"1 Preparar propuesta", text:"No se puede cerrar una oportunidad como ganada sin asignar valuador", help:"Hoy una oportunidad se puede marcar como ganada aunque nadie sepa quién la va a valuar. Con la regla, el sistema pide elegir al valuador antes de cerrarla, para que la valuación arranque sin esperar."},
        {id:"RG-02", kind:"gate", stage:"2 Solicitar / recibir información", text:"Recordatorios automáticos al cliente a los 5, +3 y +3 días; sin respuesta no arranca la valuación", help:"Cuando el cliente no manda la información, el sistema le enviaría recordatorios automáticos a los 5 días y luego a los 3 y 3 siguientes. Si después de esos tres avisos no responde, la valuación no se puede iniciar."},
        {id:"RG-03", kind:"gate", stage:"2 Solicitar / recibir información", text:"48 horas para marcar la información recibida como completa o incompleta", help:"Cuando llega la información del cliente, quien la recibe tendría 48 horas para revisarla y marcarla como completa o incompleta. Si se pasa el tiempo, se avisa al actuario responsable."},
        {id:"RG-04", kind:"gate", stage:"2 Solicitar / recibir información", text:"No se llega a facturación sin cerrar la tarea de Legal (NDA o contrato)", help:"Si el cliente pidió NDA o contrato, Legal tiene una tarea abierta. La valuación puede avanzar, pero no se puede facturar hasta que Legal cierre esa tarea."},
        {id:"RG-05", kind:"gate", stage:"3 Revisar información", text:"El Becario debe marcar el checklist de cada tarea; los perfiles Sr no", help:"Cada tarea trae una lista de puntos a revisar. Un Asesor Sr puede cerrar la tarea sin marcar la lista; un Becario tiene que marcar cada punto para poder cerrarla."},
        {id:"RG-06", kind:"gate", stage:"3 Revisar información", text:"La etapa se cierra solo con todas las tareas marcadas y el archivo base definitiva generado", help:"La etapa de revisión de información solo se puede cerrar cuando todas sus tareas (base empresa, SICI, bajas, dudas…) están marcadas y ya existe el archivo base definitiva."},
        {id:"RG-07", kind:"gate", stage:"5 Analizar supuestos", text:"Análisis de supuestos se cierra solo con la carta de hipótesis aprobada", help:"El análisis de supuestos no se puede cerrar hasta que el gerente haya aprobado la carta de hipótesis. Sin esa aprobación no se pasa a calcular pasivos."},
        {id:"RG-08", kind:"gate", stage:"6 Determinación de pasivos", text:"Determinación de pasivos se cierra cuando el cliente confirma que recibió la carta de hipótesis", help:"Después de enviar la carta de hipótesis, la etapa de pasivos solo se cierra cuando el cliente confirma que la recibió."},
        {id:"RG-09", kind:"gate", stage:"8 Reportes", text:"El reproceso por puntos no aprobados regresa como máximo al cuadro de hipótesis (4.4)", help:"Si el cliente no aprueba algo de los anexos y hay que rehacer, el sistema permite regresar hasta el cuadro de hipótesis (tarea 4.4), no más atrás. Lo que se rehaga queda marcado como reproceso."},
        {id:"RG-10", kind:"gate", stage:"8 Reportes", text:"Sin firma de balance no se avanza a la entrega", help:"El reporte no se puede entregar mientras el balance no esté firmado."},
        {id:"RG-11", kind:"gate", stage:"8 Reportes", text:"La valuación no se finaliza sin confirmar la entrega física", help:"Aunque el reporte digital ya se haya entregado, la valuación no se da por terminada hasta que se confirme la entrega física."},
        {id:"RG-12", kind:"gate", stage:"9 Cierre de la valuación", text:"Al cerrar, el estatus para factura se actualiza solo y avisa a Control Facturación", help:"Al cerrar la valuación, el sistema cambia solo el estatus a «lista para factura» y le avisa a Control Facturación, sin correo ni archivo compartido."},
        {id:"RG-13", kind:"gate", stage:"Transversal (seguimiento, preventivas, tasa de descuento)", text:"Tarea preventiva automática meses después del mes de valuación para clientes cíclicos", help:"Para los clientes que se valúan cada año, el sistema crearía sola una tarea preventiva unos meses después del mes de valuación (preparar bases, carrera salarial, bajas, anexo), asignada al último valuador."},
        {id:"RG-14", kind:"gate", stage:"Transversal (seguimiento, preventivas, tasa de descuento)", text:"Actualización de curva y tasa de descuento asignada por calendario", help:"Las actualizaciones del histórico de curva y de la tasa de descuento se asignarían automáticamente según un calendario, en lugar de que cada quien recuerde cuándo le toca."},

/* Avatares: 16 animales dentro de vidrio claro (se guarda el propio animal en la columna emoji) */

const PHASES = [

/* Escala para calificar quick wins: ¿cuánto te ayudaría en tu día a día? */
const QW_SCALE = [{v:3,t:"Mucho"},{v:2,t:"Algo"},{v:1,t:"Poco"},{v:0,t:"No aplica"}];
/* Listas a validar en la fase «Validación». Cada tipo (kind) tiene su escala; el puntaje 3–0 se guarda igual.
   El índice 0–100 se calcula con los puntajes 3/2/1 (el 0 no cuenta), salvo en tiempos, donde el 0 sí es un dato. */
const RATING_KINDS = {
  qw:   {id:"QW", t:"Quick wins", q:"¿Cuánto te ayudaría cada mejora?", h:"Son mejoras rápidas que el equipo ya identificó. Si alguna no tiene que ver con tu trabajo, marca «No aplica».",

  time: {id:"TM", t:"Tiempos", q:"¿Cuánto tarda hoy cada etapa?", h:"Piensa en una valuación típica, de que arranca la etapa a que termina, contando las esperas.",
         scale:[{v:0,t:"Menos de 1 día"},{v:1,t:"1 a 5 días"},{v:2,t:"1 a 2 semanas"},{v:3,t:"Más de 2 semanas"}], na:null, idxLabel:"Duración típica"}
};
function kindOf(q){ return (q && q.kind && RATING_KINDS[q.kind]) ? q.kind : "qw"; }
function scaleLabel(kind, v){ const sc=RATING_KINDS[kind]||RATING_KINDS.qw; const o=sc.scale.find(x=>x.v===v); return o?o.t:String(v); }
/* Herramientas que aparecen en cualquier etapa, además de las propias de cada una */
const COMMON_TOOLS = ["Correo / Teams","Excel propio","Otra"];
